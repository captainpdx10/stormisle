function spawnWhale(){const L=SPC.whale.L*sc();for(let t=0;t<40;t++){const x=R(L*.7,W-L*.7),y=R(L*.55,Hh-L*.55);if(W<L*1.6||Hh<L*1.2)return null;if(idist(x,y)<L*.6)continue;if(x<130&&y<130)continue;if(y>Hh-110&&Math.abs(x-W/2)>-1&&Math.abs(x-W/2)<200)continue;const w=make('whale',x,y,R(0,TAU));w.alpha=0;w.life=22;return w}return null}
function spawnPod(){const n=2+((Math.random()*2)|0),e=edgeSpawn(SPC.dolphin.L*sc());let lead=null;for(let i=0;i<n;i++){const a=make('dolphin',e.x-Math.cos(e.h)*i*34,e.y-Math.sin(e.h)*i*34,e.h);a.cool=R(1.5,3.5)+i*.6;a.sp*=R(.96,1.04);if(i===0)lead=a;else{a.lead=lead;a.off={u:-34*i,v:(i%2?1:-1)*26}}}}
function spawn(dt){for(const k in sch){sch[k]-=dt;if(sch[k]>0)continue;if(k==='dol'){if(!has('dolphin'))spawnPod();sch.dol=R(18,32)}else if(k==='whale'){if(!has('whale')&&!spawnWhale()){sch.whale=4;continue}sch.whale=R(26,40)}else{if(!has('shark')){const e=edgeSpawn(SPC.shark.L*sc());make('shark',e.x,e.y,e.h)}sch.shark=R(28,44)}}}
let inited=0,stT=4;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;att();if(!sea)return;fit();if(!W||!Hh)return;fr++;if(fr%30===1)island();T+=dt;
 if(!inited){inited=1;for(let i=0;i<3;i++)makeSchool()}
 spawn(dt);schools.forEach(s=>updSchool(s,dt));
 for(let i=schools.length-1;i>=0;i--){const s=schools[i],l=s.lead;if(s.leaving&&(l.x<-110||l.x>W+110||l.y<-110||l.y>Hh+110))schools.splice(i,1)}
 if(schools.filter(s=>!s.leaving).length<3){stT-=dt;if(stT<=0){makeSchool(edgeSpawn(70));stT=R(3,6)}}
 if(!boat&&fr>20)makeBoat();
 if(boat){updBoat(boat,dt);updJumps(boat,dt);updGulls(boat,dt)}
 for(let i=sw.length-1;i>=0;i--){const a=sw[i];upd(a,dt);const m=a.L*1.6;if((a.age>a.life)||(a.age>4&&(a.x<-m||a.x>W+m||a.y<-m||a.y>Hh+m)))sw.splice(i,1)}
 cx.setTransform(DP,0,0,DP,0,0);cx.clearRect(0,0,W,Hh);
 schools.forEach(s=>s.fish.forEach(drawFish));
 ['shark','dolphin','whale'].forEach(k=>sw.filter(a=>a.k===k).forEach(drawSw));
 drawFx(dt);
 cx=cx2;cx.setTransform(DP,0,0,DP,0,0);cx.clearRect(0,0,W,Hh);
 if(boat){drawBoat(boat);drawJumps(boat);drawFloats(dt)}
 cx=cx1}

const mo=new MutationObserver(()=>att());
function start(){const app=document.getElementById('app')||document.body;mo.observe(app,{childList:true,subtree:true});requestAnimationFrame(loop)}
window.SeaLife={get boat(){return boat},whale:spawnWhale,pod:spawnPod,shark:()=>{const e=edgeSpawn(90);return make('shark',e.x,e.y,e.h)},sw};
document.readyState==='loading'?addEventListener('DOMContentLoaded',start):start();
})();

<script>
/* storm / war cursor: a floating emoji that follows the mouse, so it appears the instant the 7 is rolled */
(function(){
const mk=e=>{try{const c=document.createElement('canvas');c.width=c.height=56;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='middle';x.font='44px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=5;x.shadowOffsetY=2;x.fillText(e,28,30);return c.toDataURL('image/png')}catch(_){return null}};
try{const a=mk('\uD83C\uDF2A\uFE0F'),w=mk('\uD83D\uDCA5'),st=document.createElement('style');
st.textContent='.hex.hot.stc,.sea.stormc,.sea.stormc *{cursor:'+(a?'url('+a+') 28 28,':'')+'crosshair!important}.sea.stormc.warc,.sea.stormc.warc *,.sea.stormc.warc .hex.hot.stc{cursor:'+(w?'url('+w+') 28 28,':'')+'crosshair!important}';document.head.appendChild(st)}catch(e){}
const f=document.createElement('div');f.id='fcur';document.body.appendChild(f);let px=null,py=null,tch=false;
function upd(){const sea=document.querySelector('.sea.stormc');let on=false;
 if(sea&&px!=null&&!tch){const r=sea.getBoundingClientRect();on=px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom}
 if(on){const e=sea.classList.contains('warc')?'\uD83D\uDCA5':'\uD83C\uDF2A\uFE0F';if(f.textContent!==e)f.textContent=e;f.style.transform='translate('+(px-21)+'px,'+(py-21)+'px)';f.style.display='block'}else f.style.display='none';
 document.body.classList.toggle('fcur',on)}
addEventListener('pointermove',e=>{tch=e.pointerType==='touch';px=e.clientX;py=e.clientY;upd()},{passive:true});
addEventListener('pointerdown',e=>{tch=e.pointerType==='touch';px=e.clientX;py=e.clientY},{passive:true});
window.updCur=upd})();
</script><script>
/* ---- Voice chat for private rooms: WebRTC mesh, signalling through the room database (laptop + phone) ---- */
/* Optional: paste free Open Relay (metered.ca) TURN details below so players behind strict networks can connect. */
const VOICE_ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}/* ,{urls:'turn:YOUR_HOST:443',username:'YOUR_USER',credential:'YOUR_KEY'} */];
const VMAX=8,VS={on:false,st:null,sess:0,peers:{},un:[],sub:{},mu:{},spk:{},an:{},ac:null,msg:'',mic:true,sig:''};
const vroom=()=>!!(ON&&DB&&CODE&&UID),vdoc=n=>DB.doc('rooms/'+CODE+'-'+n);
const vroster=()=>G&&G.P?G.P.filter(p=>p.id&&!p.bot&&!p.left):((LOBBY&&LOBBY.pl)||[]).filter(p=>!p.bot);
const vname=j=>{const m=vroster().find(p=>p.id===j);return m?m.nm:'Player'};
const vwait=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,4000)});
function vWatch(id,stream){try{const src=VS.ac.createMediaStreamSource(stream),a=VS.ac.createAnalyser();a.fftSize=512;src.connect(a);VS.an[id]=a}catch(e){}}
function vPC(j){const pc=new RTCPeerConnection({iceServers:VOICE_ICE});VS.st.getTracks().forEach(t=>pc.addTrack(t,VS.st));
  pc.ontrack=e=>{const p=VS.peers[j];if(!p)return;let a=p.a;if(!a){a=p.a=new Audio();a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}a.srcObject=e.streams[0];a.muted=!!VS.mu[j];a.play().catch(()=>{});vWatch(j,e.streams[0])};
  pc.onconnectionstatechange=()=>{const p=VS.peers[j];if(p&&p.pc===pc){p.ok=pc.connectionState==='connected';if(pc.connectionState==='failed'){VS.msg='Could not connect voice with '+vname(j)+'. A TURN relay may be needed.';vClose(j)}}};return pc}
function vClose(j){const p=VS.peers[j];if(!p)return;try{p.pc&&p.pc.close()}catch(e){}if(p.a){p.a.srcObject=null;p.a.remove()}delete VS.peers[j];delete VS.an[j];VS.spk[j]=false}
async function vOffer(j,rs){const p=VS.peers[j],pc=p.pc=vPC(j);await pc.setLocalDescription(await pc.createOffer());await vwait(pc);if(VS.peers[j]!==p)return;p.ot=Date.now();vdoc('vo-'+UID+'-'+j).set({sdp:pc.localDescription.sdp,t:p.ot,to:rs,from:VS.sess}).catch(()=>{})}
async function vOnOffer(j,d){if(!VS.on||d.to!==VS.sess)return;let p=VS.peers[j];if(!p)p=VS.peers[j]={rs:d.from,ot:0};if(p.rs!==d.from||p.ot===d.t)return;p.ot=d.t;if(p.pc)try{p.pc.close()}catch(e){}const pc=p.pc=vPC(j);await pc.setRemoteDescription({type:'offer',sdp:d.sdp});await pc.setLocalDescription(await pc.createAnswer());await vwait(pc);if(VS.peers[j]!==p)return;vdoc('va-'+j+'-'+UID).set({sdp:pc.localDescription.sdp,of:d.t}).catch(()=>{})}
async function vOnAnswer(j,d){const p=VS.peers[j];if(!VS.on||!p||!p.pc||d.of!==p.ot||p.done===d.of)return;p.done=d.of;try{await p.pc.setRemoteDescription({type:'answer',sdp:d.sdp})}catch(e){}}
function vPresence(j,d){if(!VS.on)return;const p=VS.peers[j];if(!d||!d.on){if(p)vClose(j);return}if(p&&p.rs===d.s)return;if(!p&&Object.keys(VS.peers).length>=VMAX-1)return;if(p)vClose(j);VS.peers[j]={rs:d.s,ot:0};if(UID<j)vOffer(j,d.s)}
function vSubscribe(){if(!VS.on)return;vroster().forEach(m=>{const j=m.id;if(!j||j===UID||VS.sub[j])return;VS.sub[j]=1;
  VS.un.push(vdoc('vp-'+j).onSnapshot(sn=>vPresence(j,sn.exists?sn.data():null)));
  VS.un.push(j<UID?vdoc('vo-'+j+'-'+UID).onSnapshot(sn=>{if(sn.exists)vOnOffer(j,sn.data())}):vdoc('va-'+UID+'-'+j).onSnapshot(sn=>{if(sn.exists)vOnAnswer(j,sn.data())}))})}
async function vJoin(){if(VS.on||!vroom())return;if(!confirm('Voice is live with everyone in this room who joins. Continue?'))return;
  try{VS.st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){VS.msg='Microphone blocked. Allow it in your browser settings.';vdRender(true);return}
  VS.ac=VS.ac||new(window.AudioContext||window.webkitAudioContext)();if(VS.ac.resume)VS.ac.resume();
  VS.on=true;VS.sess=Date.now();VS.mic=true;VS.msg='';VS.sub={};vWatch(UID,VS.st);
  vdoc('vp-'+UID).set({on:true,s:VS.sess,t:Date.now()}).catch(()=>{});vSubscribe();vdRender(true)}
function vLeave(){if(!VS.on)return;VS.on=false;Object.keys(VS.peers).forEach(vClose);VS.un.forEach(f=>{try{f()}catch(e){}});VS.un=[];VS.sub={};VS.an={};VS.spk={};
  if(VS.st)VS.st.getTracks().forEach(t=>t.stop());VS.st=null;try{vdoc('vp-'+UID).set({on:false,s:VS.sess,t:Date.now()}).catch(()=>{})}catch(e){}vdRender(true)}
function vMic(){if(!VS.st)return;VS.mic=!VS.mic;VS.st.getAudioTracks().forEach(t=>t.enabled=VS.mic);vdRender(true)}
function vMute(j){VS.mu[j]=!VS.mu[j];const p=VS.peers[j];if(p&&p.a)p.a.muted=VS.mu[j];vdRender(true)}
function vdRender(force){let el=document.getElementById('vdock');if(!el){el=document.createElement('div');el.id='vdock';document.body.appendChild(el)}
  if(!vroom()){if(el.innerHTML)el.innerHTML='';return}
  const ids=Object.keys(VS.peers),sig=JSON.stringify([VS.on,VS.mic,VS.msg,ids,ids.map(j=>!!(VS.peers[j].ok)),VS.mu]);if(!force&&sig===VS.sig)return;VS.sig=sig;
  if(!VS.on){el.innerHTML=`<button class="vj" onclick="vJoin()">🎙 Join voice</button>${VS.msg?`<div class="vm">${esc(VS.msg)}</div>`:''}`;return}
  const me=`<div class="vr" data-v="${UID}"><i></i><span>You</span><button class="alt" onclick="vMic()">${VS.mic?'🎙 On':'🔇 Muted'}</button></div>`;
  el.innerHTML=`<div class="vp"><b>🎙 Voice</b>${me}${ids.map(j=>`<div class="vr" data-v="${j}"><i></i><span>${esc(vname(j))}${VS.peers[j].ok?'':' …'}</span><button class="alt" onclick="vMute('${j}')">${VS.mu[j]?'🔇':'🔊'}</button></div>`).join('')}${VS.msg?`<div class="vm">${esc(VS.msg)}</div>`:''}<button onclick="vLeave()">Leave voice</button></div>`}
function vLevels(){if(!VS.on)return;Object.keys(VS.an).forEach(id=>{const a=VS.an[id],b=new Uint8Array(a.fftSize);a.getByteTimeDomainData(b);let s=0;for(const x of b){const v=(x-128)/128;s+=v*v}const on=Math.sqrt(s/b.length)>.03&&!(id===UID&&!VS.mic)&&!(id!==UID&&VS.mu[id]);if(VS.spk[id]!==on){VS.spk[id]=on;const r=document.querySelector('#vdock [data-v="'+id+'"]');if(r)r.classList.toggle('sp',on)}})}
setInterval(()=>{if(VS.on){if(!vroom())vLeave();else vSubscribe()}vdRender();vLevels()},250);
addEventListener('pagehide',()=>{if(VS.on)try{vdoc('vp-'+UID).set({on:false,s:VS.sess,t:Date.now()})}catch(e){}});
</script>
