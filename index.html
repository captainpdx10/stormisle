let G=null,H=[],V={},E={},NP=4,NAMES=[];
let ON=false,ME=-1,UID=null,DB=null,CODE='',LOBBY=null,LOCAL=false,UN=[],MYNAME='',BOARD=[],MY={r:1000,w:0,g:0},MSG='',RES='',DONE='',RAD=2,PT=[],OPT={size:0,diff:1,tl:90};

let TOPEN=false;let TB={g:'T',r:'C'},TO={to:-1,give:'T',get:'C',n:1,m:1};const stat=i=>{const t=Object.values(V);return '🛣️'+Object.values(E).filter(e=>e.o===i).length+' · 🏠'+t.filter(v=>v.o===i&&v.l===1).length+' · 🏙️'+t.filter(v=>v.o===i&&v.l===2).length};

const score=(i,pub)=>Object.values(V).reduce((s,v)=>s+(v.o===i?v.l:0),0)+(G.lr===i?2:0)+(G.la===i?2:0)+(pub?0:[...(G.P[i].dv||[]),...(G.P[i].nw||[])].filter(c=>c==='vp').length);

function build(n,r0,df=1){
  const rad=Math.max(r0||(n<=4?2:n<=6?3:4),n<=5?2:3);RAD=rad;H=[];V={};E={};
  for(let q=-rad;q<=rad;q++)for(let r=Math.max(-rad,-q-rad);r<=Math.min(rad,-q+rad);r++)H.push({q,r,x:SZ*R3*(q+r/2),y:SZ*1.5*r});

    for(let j=0;j<6;j++){const a=Math.PI/180*(60*j-30),x=h.x+SZ*Math.cos(a),y=h.y+SZ*Math.sin(a),k=Math.round(x)+','+Math.round(y);

function start(){SEEN={};
  DLK='';LEAVEQ=false;const n=NP,P=[];for(let i=0;i<n;i++)P.push({nm:(NAMES[i]||'').trim()||(BOTS[i]?'Bot ':'Player ')+(i+1),bot:!!BOTS[i],c:COL[i],res:{T:0,C:0,S:0,G:0,M:0},dv:[],nw:[],kn:0});

const say=m=>{G.log.unshift(m);G.log=G.log.slice(0,6)};

function checkWin(){const s=score(G.cur);if(s>=10){G.ph='over';G.win=G.cur;G.mode=null}}

function vc(k){if(!mine())return;const p=G.cur,v=V[k];

function hc(i){if(!mine()||G.ph!=='storm'||H[i]===G.storm)return;G.storm=H[i];

  if(vic.length){const o=vic[Math.random()*vic.length|0],c=takeCard(G.P[o]);G.P[G.cur].res[c]++;say(G.P[G.cur].nm+' moved the storm and took a card from '+G.P[o].nm+'.')}

  else{const got={};H.forEach(h=>{if(h.n!==d||h===G.storm)return;h.vs.forEach(k=>{const v=V[k];if(v.o>=0){const a=v.l*(G.boom?2:1);G.P[v.o].res[h.t]+=a;got[v.o]=(got[v.o]||0)+a;G.fx.push([k,v.o,h.t,a]);const gg=G.gain[v.o]=G.gain[v.o]||{};gg[h.t]=(gg[h.t]||0)+a}})});

function lobbyUI(){const L=LOBBY,host=L.host===UID,n=L.pl.length,seats=Math.min(8,Math.max(4,n+1)),link=location.href.split('#')[0]+'#'+CODE;
  const rows=L.pl.map((p,i)=>`<div class="pl"><span class="dot" style="background:${COL[i]}">${esc((p.nm||'?')[0])}</span><span>${esc(p.nm)}${p.bot?' 🤖':''}${p.id===UID?' (you)':''}${p.id===L.host?' 👑 host':''}</span>${p.bot?'':`<span class="rk">${tier(p.r)} ${p.r}</span>`}</div>`).join('')+Array.from({length:seats-n},()=>`<div class="pl seat"><span class="dot" style="background:transparent;box-shadow:inset 0 0 0 2px var(--line)"></span><span>Waiting for a player…</span></div>`).join('');
  const msg=n<2?(host?'You need at least 2 players to start. Send the code to a friend to get started.':'Waiting for more players to join…'):(host?'Ready! Start when everyone has joined.':'Waiting for the host to start the game…');
  return `<div class="menu m2"><h1>Waiting for players</h1><div class="sec2"><div class="lbl2" style="margin-top:0">Room code. Friends type this in Online → Join.</div><div class="code"><b>${CODE}</b><span class="row" style="margin:0"><button class="alt" onclick="copyTxt('${CODE}',this)">Copy code</button><button class="alt" onclick="copyTxt('${link}',this)">Copy invite link</button></span></div>${TESTDB?'<p class="hint">Test mode: open this page in a second tab, tap Online and join with this code.</p>':''}</div>
  <div class="sec2"><h3>Players (${n} of 8)</h3>${rows}<p class="wait"><i></i>${msg}</p>
  <div class="row">${host?`<button ${n<2?'disabled':''} onclick="go()">Start game (${n})</button>`:''}<button class="alt" onclick="quit()">Leave room</button></div></div>${host?optUI():'<p class="log">Island size, difficulty and timer are chosen by the host.</p>'}</div>`}
/* ---------- bots, turn timer, leaving ---------- */
const pips=n=>n?6-Math.abs(7-n):0;
function vsc(k){const v=V[k],ty=new Set();let s=0;v.hx.forEach(h=>{if(h.t!=='D'){s+=pips(h.n);ty.add(h.t)}});s+=ty.size*.8;if((G.pt||[]).some(q=>{const e=E[q.k];return e&&(e.a===k||e.b===k)}))s+=1.2;return s+Math.random()*.4}
const bestBy=(a,f)=>{let b=null,bs=-1e9;a.forEach(x=>{const s=f(x);if(s>bs){bs=s;b=x}});return b};
const botEdge=p=>bestBy(Object.values(E).filter(e=>canR(e.k,p)),e=>Math.max(...[e.a,e.b].map(k=>{const v=V[k];return v.o<0&&[...v.adj].every(a=>V[a].o<0)?vsc(k):0}))+Math.random());
function botGoal(){const p=G.cur,t=Object.values(V).some(v=>v.o===p&&v.l===1),sp=Object.values(V).some(v=>canS(v.k,p));if(t&&sp)return (G.turnId+p)%2?'hub':'settle';return t?'hub':sp?'settle':'road'}
function botNeeds(n){const R=G.P[G.cur].res,c=COST[botGoal()],out=[];KEYS.forEach(k=>{for(let i=Math.max(0,(c[k]||0)-R[k]);i>0;i--)out.push(k)});const low=KEYS.slice().sort((a,b)=>R[a]-R[b]);while(out.length<n)out.push(low[out.length%5]);return out.slice(0,n)}
function botTrade(){const p=G.cur,R=G.P[p].res,c=COST[botGoal()],miss=KEYS.filter(k=>R[k]<(c[k]||0));for(const m of miss)for(const s of KEYS){if(s===m)continue;const r=rate(p,s);if(R[s]-(c[s]||0)>=r){R[s]-=r;R[m]++;say(G.P[p].nm+' traded '+r+' '+RS[s][1]+' for 1 '+RS[m][1]+'.');render();return true}}return false}
function botStorm(){const p=G.cur,t=bestBy(H.map((h,i)=>i).filter(i=>H[i]!==G.storm),i=>{const h=H[i];let s=Math.random();h.vs.forEach(k=>{const v=V[k];if(v.o>=0)s+=(v.o===p?-1.6:1)*v.l*Math.max(1,pips(h.n))});if(h.t==='D')s-=.5;return s});hc(t)}
function botStep(){const p=G.cur,P=G.P[p],R=P.res;
  if(G.ph==='discard'){const d=G.dc[0],q=G.P[d.i];disc(KEYS.slice().sort((a,b)=>q.res[b]-q.res[a])[0]);return}
  if(G.ph==='setup'){if(G.mode==='settle'){const v=bestBy(Object.values(V).filter(v=>canS(v.k,p)),v=>vsc(v.k));if(v)vc(v.k)}
    else if(G.mode==='road'){const e=bestBy(Object.values(E).filter(e=>canR(e.k,p)),e=>{const o=e.a===G.last?e.b:e.a;return (V[o].o<0?vsc(o):0)+Math.random()});if(e)ec(e.k)}return}
  if(G.ph==='roll'){roll();return}
  if(G.ph==='storm'){botStorm();return}
  if(G.ph!=='act')return;
  if(G.pend==='plenty'){const n=botNeeds(2);R[n[0]]++;R[n[1]]++;G.pend=null;say(P.nm+' won the lottery and took 2 resources from the bank.');render();return}
  if(G.pend==='mono'){let b='T',bm=-1;KEYS.forEach(k=>{const t=G.P.reduce((s,q,i)=>s+(i===p?0:q.res[k]),0);if(t>bm){bm=t;b=k}});let t=0;G.P.forEach((q,i)=>{if(i!==p){t+=q.res[b];q.res[b]=0}});R[b]+=t;G.pend=null;say(P.nm+' declared "Now I am the President!" and chose '+RS[b][1]+', taking '+t+' from the others.');render();return}
  if(G.free>0){const e=botEdge(p);if(!e){G.free=0;G.mode=null;render();return}G.mode='road';ec(e.k);return}
  const own=Object.values(V).filter(v=>v.o===p&&v.l===1),spots=Object.values(V).filter(v=>canS(v.k,p)),g=botGoal();
  const canH=own.length&&afford('hub'),canT=spots.length&&afford('settle');
  if(canH&&(g==='hub'||!canT)){G.mode='hub';vc(bestBy(own,v=>vsc(v.k)).k);return}
  if(canT){G.mode='settle';vc(bestBy(spots,v=>vsc(v.k)).k);return}
  if(botTrade())return;
  if(!G.dp){const dv=P.dv;
    if(dv.includes('knight')){playDev('knight');return}
    if(dv.includes('plenty')){playDev('plenty');return}
    if(dv.includes('mono')){const m=Math.max(...KEYS.map(k=>G.P.reduce((s,q,i)=>s+(i===p?0:q.res[k]),0)));if(m>=3){playDev('mono');return}}
    if(dv.includes('road')&&botEdge(p)){playDev('road');return}}
  if(g==='road'&&afford('road')){const e=botEdge(p);if(e){G.mode='road';ec(e.k);return}}
  if(afford('dev')&&G.deck&&G.deck.length){buyDev();return}
  endTurn()}
function botForce(){const p=G.cur;if(G.ph==='act'){G.pend=null;G.free=0;G.mode=null;endTurn()}else if(G.ph==='storm'){hc(Math.floor(Math.random()*H.length))}else if(G.ph==='roll'){roll()}
  else if(G.ph==='discard'){const d=G.dc[0];if(d){const q=G.P[d.i],k=KEYS.find(k=>q.res[k]);if(k)disc(k);else{G.dc.shift();if(!G.dc.length)G.ph='storm';render()}}}
  else if(G.ph==='setup'){if(G.mode==='settle'){const v=Object.values(V).find(v=>canS(v.k,p));if(v)vc(v.k)}else{const e=Object.values(E).find(e=>canR(e.k,p));if(e)ec(e.k)}}}
function botOffer(o){const c=G.P.map((q,j)=>j).filter(j=>j!==o.from&&G.P[j].bot&&(o.to<0||o.to===j));if(!c.length)return null;const ok=c.find(j=>G.P[j].res[o.get]>=o.m&&o.n>=o.m);if(ok!==undefined)return [ok,true];return o.to>=0?[o.to,false]:null}
function botRun(f){BOTRUN=true;try{f()}catch(e){console.error(e)}finally{BOTRUN=false}if(G)render()}
const sigOf=()=>[G.ph,G.mode,G.cur,G.free,G.pend,G.s,G.turnId,G.offer?1:0,G.dc&&G.dc[0]?G.dc[0].n:0,G.P.map(q=>tot(q)).join(','),Object.values(V).filter(v=>v.o>=0).length,Object.values(E).filter(e=>e.o>=0).length].join('|');
function syncDL(){if(!G)return;if(paused()){DLK='';DL=Infinity;LASTACT=Date.now();return}const k=G.turnId+'|'+(G.ph==='discard'&&G.dc[0]?'d'+G.dc[0].i:'');if(k!==DLK){DLK=k;DL=G.tl>0?Date.now()+(G.ph==='discard'?20000:G.tl*1000):Infinity}LASTACT=Date.now()}
function updTimer(){const e=$('#tm');if(!e||!G||DL===Infinity)return;const t=Math.max(0,Math.ceil((DL-Date.now())/1000));e.textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+(G.ph==='discard'?' · discard':'');e.classList.toggle('late',t<=10)}
function tick(){if(!G||G.ph==='over'||paused())return;updTimer();if(FXT&&Date.now()-FXT>3400){FXT=0;render()}
  const now=Date.now(),idle=now-LASTACT,pi=G.ph==='discard'&&G.dc[0]?G.dc[0].i:G.cur,P=G.P[pi];if(!P)return;
  let rank=0;
  if(ON){const hs=G.P.map((q,i)=>i).filter(i=>!G.P[i].bot),f=G.offer&&!P.bot?G.offer.from:pi,ord=[...(hs.includes(f)?[f]:[]),...hs.filter(i=>i!==f)];rank=ME>=0?ord.indexOf(ME):-1;if(rank<0)return}
  const ex=rank*4000,exp=DL!==Infinity&&now>DL+ex,o=G.offer;
  if(o&&!botOn()&&idle>1500+ex){const r=botOffer(o);if(r){botRun(()=>answer(r[1],r[0]));return}}
  const auto=P.bot||(G.ph!=='discard'&&P.ap===G.turnId)||(G.ph==='discard'&&exp);
  if(!auto){if(exp){P.ap=G.turnId;P.miss=(P.miss||0)+1;say(P.nm+' ran out of time. Autopilot plays the rest of the turn.');LOCAL=ON;render()}return}
  if(idle<BOTMS+ex)return;
  const before=sigOf();botRun(botStep);
  if(G&&sigOf()===before){if(++NOP>=4){NOP=0;botRun(botForce)}}else NOP=0}
setInterval(tick,350);
const exitUI=()=>{if(LEAVEQ)return `<span class="ev">${ON?'Leave? The others can continue with a bot or end the game.':'Quit to home? This game will be lost.'}</span><button class="alt" onclick="quit()">Yes, leave</button><button onclick="LEAVEQ=false;render()">Stay</button>`;
  return `<button class="alt" onclick="${G.ph==='over'?'quit()':'LEAVEQ=true;render()'}">${ON&&G.ph!=='over'?'Leave game':'🏠 Home'}</button>`};
const bb=()=>ON&&G&&G.P[ME]&&(G.P[ME].bot||G.P[ME].left)&&G.ph!=='over'?`<div class="banner">${G.P[ME].left?'You left this game.':'🤖 A bot is playing your seat.'} <button class="alt" style="color:var(--onacc);border-color:currentColor" onclick="comeback()">Take it back</button></div>`:'';
const decider=()=>G.P.findIndex(q=>!q.bot&&!q.left);
function pauseUI(){if(!paused()||ME<0||G.P[ME].left)return '';const names=G.pause.map(i=>esc(G.P[i].nm)).join(' and '),d=decider();
  const body=ME===d?`<h2>${names} left the game</h2><p>Choose how to carry on.</p><div class="row"><button onclick="pauseGo(true)">🤖 Continue with a bot</button><button class="alt" onclick="pauseGo(false)">🏁 End game with current tally</button></div>`:`<h2>${names} left the game</h2><p>Waiting for ${d>=0?esc(G.P[d].nm):'the host'} to choose: continue with a bot or end the game.</p>`;
  return `<div class="ovl"><div class="ovc">${body}</div></div>`}
function pauseGo(bot){if(!paused()||ME!==decider())return;
  if(bot){G.pause.forEach(i=>{const q=G.P[i];q.left=false;q.bot=true;q.ap=null;q.miss=0;say(q.nm+' is replaced by a bot.')});G.pause=null;DLK=''}
  else{const w=G.P.map((q,i)=>i).sort((a,b)=>score(b)-score(a)||a-b)[0];G.pause=null;G.ph='over';G.win=w;G.ended=true;G.mode=null;G.offer=null;say('Game ended early with the current tally.')}
  LOCAL=true;render()}
function comeback(){const q=G.P[ME];q.bot=false;q.left=false;G.pause=(G.pause||[]).filter(i=>i!==ME);if(!G.pause.length)G.pause=null;q.ap=null;q.miss=0;say(q.nm+' is back at the table.');LOCAL=true;render()}
async function penalty(){if(!DB||DONE===CODE)return;DONE=CODE;try{const ref=DB.doc('players/'+UID),sn=await ref.get(),o=sn.exists?sn.data():{r:1000,w:0,g:0};if(o.lg===CODE)return;const r=Math.max(0,o.r-25);MY={r,w:o.w,g:o.g+1};await ref.set({nm:MYNAME||'Player',r,w:o.w,g:o.g+1,lg:CODE})}catch(e){}}
async function quit(){LEAVEQ=false;
  try{if(ON&&CODE&&DB){
    if(G&&G.ph!=='over'&&ME>=0){const q=G.P[ME];q.left=true;q.ap=null;G.pause=[...(G.pause||[]).filter(i=>i!==ME),ME];say(q.nm+' left the game.');UN.forEach(f=>f());UN=[];await push();await penalty()}
    else if(!G&&LOBBY){UN.forEach(f=>f());UN=[];const pl=LOBBY.pl.filter(x=>x.id!==UID),up={pl};if(LOBBY.host===UID){const h=pl.find(x=>!x.bot);if(h)up.host=h.id}await DB.doc('rooms/'+CODE).update(up)}}}catch(e){}
  leave()}
function solo(){NP=SOLO+1;BOTS=[false,...Array(SOLO).fill(true)];NAMES=[MYNAME||'You'];start();BOTS=[];NAMES=[]}
async function init(){if(typeof claude==='undefined'){if(FB_CONFIG)await fbBoot();else localBoot()}try{const u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;UID=await u.id();if(!UID)return;DB=d;
  const sn=await DB.doc('players/'+UID).get();if(sn.exists){const o=sn.data();MY={r:o.r,w:o.w,g:o.g};MYNAME=o.nm||''}
  DB.collection('players').orderBy('r','desc').limit(10).onSnapshot(q=>{BOARD=q.docs.map(x=>x.data());if(!G&&!LOBBY&&!(document.activeElement&&document.activeElement.matches('input')))render()});render()}catch(e){}}
init();render();
</script></body></html>
