/* Calm, glassy, Apple-style panels. Looks only; no game logic touched. */
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;--hair:rgba(255,255,255,.09);--glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03))}

.card{background:var(--glass)!important;border:1px solid var(--hair)!important;border-radius:22px!important;padding:16px!important;margin-bottom:12px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.28)!important}

button{font-family:var(--sf)!important;font-weight:600!important;letter-spacing:-.1px;border-radius:14px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px rgba(0,0,0,.22)!important;transition:transform .15s,background .15s,opacity .15s!important}
button:active:not(:disabled){transform:scale(.97)!important;box-shadow:0 2px 6px rgba(0,0,0,.25)!important}

.slbt{display:block;overflow:visible}.slbb{transform-box:fill-box;transform-origin:50% 100%;animation:btb 4s ease-in-out infinite alternate}@keyframes btb{from{transform:rotate(-3deg)}to{transform:rotate(3deg) translateY(1px)}}

function tutBot(){

    if(G.mode==='road'){const e=G.last===TV.BA?TE.BE1:TE.BE2;if(canR(e,p)){ec(e);return true}return false}
    return false}
  if(G.ph==='roll'){roll();return true}
  if(G.ph==='storm'){hc(4);TUT.b7=1;return true}                       /* its 7: the storm lands on YOUR best tile */
  if(G.ph==='steal'){steal(G.sv[0]);return true}
  if(G.ph==='act'){
    if((TUT.rb===3||TUT.rb===4)&&TUT.sp&&TUT.sp.length){TUT.sp.shift()();awards();render();return true}
    endTurn();return true}
  return false}

{h:'Be smart before you trade!',t:"⚠️ Why would a rival give you cards so easily? Only if the deal helps THEM too! Before you offer or accept, ask: <b>does this give him the exact card he needs for a city, a town or the win?</b> Never help the leader, and never trade with a player who is 1 point from winning. Trade with players who are behind, and say no when a deal helps your rival more than you."},
{h:'Limits',t:"Each player has only a limited number of pieces: <b>5 towns, 4 cities and 15 roads</b> in a 2 to 4 player game (7 towns, 5 cities and 22 roads with 5 to 6 players, 10 towns, 6 cities and 30 roads with 7 to 8 players). A city gives its town piece back. The bank also has a limited stack of each card: <b>19 per kind</b> with 2 to 4 players, 24 with 5 to 6 players and 38 with 7 to 8 players, and everybody can see what is left. The Special deck is limited too: 25 cards, 34 with 5 to 6 players and 50 with 7 to 8 players. If the bank runs out of a card, a roll cannot pay it, so spend your cards!<br><br>🧱 <b>Big games (5 to 8 players):</b> once you have used <b>all your roads</b>, tap one of your own roads and confirm with <b>Demolish</b>. You get the road piece back but <b>no cards</b>, and you can <b>Undo</b> it until you do something else. You cannot demolish the only road that touches one of your towns or cities, or a road that would split your road network in two."},

const helpUI=()=>!HELP?'':`<div class="ovl" onclick="if(event.target===this){HELP=false;render()}"><div class="ovc help"><h2>How to play</h2>
<p><b>🎯 Goal.</b> Be the first to reach the <b>target score</b>: 10 points for 2 to 4 players, 12 for 5, 15 for 6, 17 for 7 and 20 for 8 players.<br>Town = 1 · City = 2 · 🛣️ Longest road (5+ roads connected in one line, side branches do not count, longest wins) = +2 · 👥 Biggest population (3+ Mayor cards played, most wins) = +2 · each hidden 🃏 Joker = +1.</p>
<p><b>🏁 Start.</b> Everyone places two towns and two roads. Your second town gives you starting cards from the tiles around it.</p>
<p><b>🎲 Your turn.</b> Roll the dice. Every town next to a tile with that number collects 1 card (a city collects 2). Then build, trade or play a Special card, and tap <i>End turn</i>. Each new round also brings a random event.</p>
<p><b>🔨 Costs.</b><br>Road: 🌲 🧱<br>Town: 🌲 🧱 ☀️ 🌾<br>City (upgrade a town): 🌾 🌾 ⛏️ ⛏️ ⛏️<br>Special card: ☀️ 🌾 ⛏️</p>
<p><b>📍 Where you can build.</b> A road must touch one of your roads or towns. A town must touch one of your roads and be at least 2 steps away from every other town or city. A city replaces one of your own towns. If an option is greyed out, the game tells you why.</p>
<p><b>🔁 Trading.</b> The bank swaps 4 for 1. If one of your towns or cities touches a <b>3:1 port</b>, the bank trade drops from 4 for 1 to 3 for 1 for every resource. A matching <b>2:1 port</b> still gives you 2 for 1 on that resource. You can also offer trades to other players.</p>
<p><b>🃏 Special cards.</b> Buy one for ☀️ 🌾 ⛏️ and draw a random card. You may play <b>one card per turn</b>, and not on the turn you bought it. Jokers are the exception: they work by themselves.</p>
<p>🏙️ <b>Mayor.</b> Move the storm to any tile and steal a random card from a player who builds there. Use it to shut down the tile your rival depends on. Play 3 Mayors and you can take the 👥 Biggest population bonus (+2).</p>
<p>🛣️ <b>Road building.</b> Build 2 roads for free. Perfect for racing to a good town spot or for taking the 🛣️ Longest road bonus (+2).</p>
<p>🎟️ <b>Lottery.</b> Take any 2 resources you like from the bank. Use it when you are 1–2 cards short of a town or city.</p>
<p>🎩 <b>President.</b> Pick 1 resource and every other player hands you all of theirs. You choose blind: the game never shows how many cards others hold, like Catan's Monopoly card. Watch what rivals collect and guess what they are hoarding.</p>

<p><b>🌪️ Rolling a 7.</b> Players with more than 7 cards discard half. You have 45 seconds to discard, or cards are discarded at random. The roller clicks a tile to place the storm (the storm tile pays nothing) and steals a card. If the <b>same player</b> rolls a 7 again on their very next turn, it is a <b>civil war ⚔️</b> (other players' rolls in between do not matter, but any other number from that player cancels it): the roller clicks a tile and every town on it is destroyed, cities drop to towns, and roads on it are lost. The ⚔️ vanishes at the end of the turn and the storm stays where it was.</p>
<p><b>🌪️ Unrest badge.</b> After a player rolls a 7, a 🌪️ appears next to their name. If that player rolls another 7 on their very next turn, it is a civil war. Any other number removes the badge.</p>
<p><b>📦 Limits.</b> Each player has only a limited number of pieces on the board: 5 towns, 4 cities and 15 roads with 2 to 4 players, 7 towns, 5 cities and 22 roads with 5 to 6 players, 10 towns, 6 cities and 30 roads with 7 to 8 players (${LIM.t} towns, ${LIM.c} cities and ${LIM.r} roads in this game). A city gives its town piece back, and pieces destroyed by a war come back too. The bank has a limited stack of each card, open for everyone to see: 19 for 2 to 4 players, 24 for 5 to 6, 38 for 7 to 8. If the bank cannot pay a card on a roll, one player gets what is left, but if two or more players are owed that card, nobody gets it. The Special deck is one shuffled pile with the same mix as Catan: about 56% Mayor, 18 to 20% Joker and 8 to 9% each of Road building, Lottery and President. It has 25 cards with 2 to 4 players, 34 with 5 to 6 players and 50 with 7 to 8 players (${deckFor(G&&G.n||4).length} in this game). When the deck is empty, nobody can buy a Special card. You can play only 1 Special card per turn, never on the turn you bought it (Jokers don't count).</p>

/* __setApp: like a.innerHTML=html, but if a bottom sheet (Table / Build / Trade...) is already open we keep its scroll container in the DOM
   and only refresh its content. Rebuilding it on every bot tick killed the finger scroll on phones. */
function __setApp(a,html){
  const oS=a.querySelector(':scope > .sheet'),oB=a.querySelector(':scope > .sheet-bg');
  if(!oS||!oB){a.innerHTML=html;return}
  const t=document.createElement('div');t.innerHTML=html;
  const nS=t.querySelector(':scope > .sheet'),nB=t.querySelector(':scope > .sheet-bg');
  if(!nS||!nB||nS.classList.contains('in')||nS.className!==oS.className){a.innerHTML=html;return}
  const oBody=oS.querySelector('.sh-b'),nBody=nS.querySelector('.sh-b');
  if(!oBody||!nBody){a.innerHTML=html;return}
  const top=oBody.scrollTop;
  if(oBody.innerHTML!==nBody.innerHTML){oBody.innerHTML=nBody.innerHTML;oBody.scrollTop=top}
  const before=[],after=[];let seen=false;
  [...t.childNodes].forEach(n=>{if(n===nS){seen=true;return}if(n===nB)return;(seen?after:before).push(n)});
  [...a.childNodes].forEach(n=>{if(n!==oS&&n!==oB)n.remove()});
  before.forEach(n=>a.insertBefore(n,oB));
  after.forEach(n=>a.appendChild(n));
}

  function env(g,t,a,hold,r,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+a+hold);g.gain.linearRampToValueAtTime(.0001,t+a+hold+r)}
  function pad(m,t,dur){

  }
  function pluck(m,t){

window.langRow=()=>'<div class="lbl2" style="margin-top:0">🌐 Language</div><select aria-label="Language" style="width:100%;margin:4px 0 10px" onchange="SIsetLang(this.value)">'+LG.map(l=>'<option value="'+l[0]+'"'+(l[0]===lang?' selected':'')+'>'+l[1]+'</option>').join('')+'</select>'+voiceRow()+audioRows();
function boot(){
  const st0=document.createElement('style');st0.textContent='.ovl .ovc{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.ovl .ovc select{width:100%}';document.head.appendChild(st0);
  const sel=document.createElement('select');sel.id='langsel';sel.setAttribute('aria-label','Language');
  sel.style.cssText='position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:95;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px Figtree,system-ui,sans-serif;max-width:46vw;opacity:.95';
  LG.forEach(l=>{const o=document.createElement('option');o.value=l[0];o.textContent='🌐 '+l[1];sel.appendChild(o)});
  sel.value=lang;
  /* first visit only: pick once, then the picker moves into Settings */
  const done=()=>{try{localStorage.setItem('stormisle-lang',lang)}catch(e){}sel.remove();try{render()}catch(e){}};
  sel.onchange=()=>{setLang(sel.value);done()};sel.onblur=()=>setTimeout(done,150);
  /* language picker lives on the home screen and in Settings */
  if(typeof tutStart==='function'){const ts=tutStart;window.tutStart=function(){guide();return ts.apply(this,arguments)}}
  document.documentElement.lang=lang;guide();
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
  tr();
}

const VO={
hi:['पासा फेंकें।','अपनी बारी खत्म करने के लिए बारी समाप्त बटन दबाएँ।','स्क्रीन पर चमकती जगह या बटन को दबाएँ।','अब Coach Bot की बारी है। बोर्ड देखें।','हर टाइल एक तरह का कार्ड देती है। टाइल की संख्या वही पासे की संख्या है। पासे पर वह संख्या आए, तो पास के कस्बे को कार्ड मिलते हैं। कस्बा 1 अंक, शहर 2 अंक का है।','पासे पर 7 आए तो तूफ़ान आता है। जिसके पास 7 से ज़्यादा कार्ड हैं, वह आधे फेंकता है। फिर आप तूफ़ान को एक टाइल पर रखते हैं। वह टाइल कार्ड देना बंद कर देती है, और आप एक कार्ड चुराते हैं।','लगातार दो बार 7 आए तो गृहयुद्ध होता है! आप एक टाइल पर हमला चुनते हैं और वहाँ की इमारतें बिगड़ती हैं। सबसे लंबी सड़क और अंक देखते रहें। 5 अंक पहले बनाने वाला जीतता है।','विशेष कार्ड खास ताकत देते हैं: मेयर, दो मुफ़्त सड़कें, लॉटरी, राष्ट्रपति और जोकर। इन्हें कार्ड देकर खरीदें और अपनी बारी में खेलें।','बैंक से आप एक जैसे चार कार्ड देकर एक मनचाहा कार्ड ले सकते हैं। बंदरगाह से यह सस्ता होता है। आप दूसरे खिलाड़ियों से भी अदला-बदली कर सकते हैं।','बधाई, आप जीत गए! अब आप कस्बे, सड़कें, पासा, 7, तूफ़ान, गृहयुद्ध, शहर, बैंक, व्यापार और विशेष कार्ड जानते हैं। असली खेल के लिए तैयार?','स्टॉर्म आइल में आपका स्वागत है! आप एक छोटे द्वीप पर Coach Bot के ख़िलाफ़ खेलेंगे। इस अभ्यास खेल में जो पहले 5 अंक बनाए, वह जीतता है। असली खेल 10 अंक तक चलते हैं।','स्टॉर्म आइल कार्ड जमा करने और निर्माण का खेल है। पासा फेंकें, कार्ड पाएँ, कस्बे, शहर और सड़कें बनाएँ। असली मोड़ संख्या 7 है। एक बार 7 आए तो तूफ़ान आता है, लेकिन अगली ही बारी में फिर 7 आए तो गृहयुद्ध हो जाता है! हम सब कुछ धीरे-धीरे, कदम दर कदम सीखेंगे।'],
es:['Lanza los dados.','Pulsa Terminar turno.','Toca el punto o botón que brilla en la pantalla.','Es el turno de Coach Bot. Mira el tablero.','Cada casilla da un tipo de carta. Su número es el número de dado. Si sale, los pueblos junto a ella reciben cartas. Un pueblo vale 1 punto y una ciudad, 2.','Un 7 es una tormenta. Quien tenga más de 7 cartas descarta la mitad. Luego colocas la tormenta en una casilla: deja de dar cartas y robas una carta.','¡Dos 7 seguidos son una guerra civil! Eliges una casilla para atacar y sus edificios sufren. Vigila el camino más largo y los puntos. Gana quien llegue primero a 5.','Las cartas especiales dan poderes: alcalde, dos caminos gratis, lotería, presidente y comodín. Se compran con cartas y se juegan en tu turno.','En el banco cambias cuatro cartas iguales por una que necesites. Los puertos lo hacen más barato. También puedes intercambiar con otros jugadores.','¡Felicidades, ganaste! Ya conoces pueblos, caminos, dados, el 7, la tormenta, la guerra civil, ciudades, banco, comercio y cartas especiales. ¿Listo para una partida real?','¡Bienvenido a Storm Isle! Juegas contra Coach Bot en una isla pequeña. En esta partida de práctica gana quien llegue primero a 5 puntos. Las partidas reales llegan a 10.','Storm Isle es un juego de reunir cartas y construir. Lanza los dados, consigue cartas y construye pueblos, ciudades y caminos. La gran sorpresa es el número 7: un 7 es una tormenta, pero si sacas otro 7 en tu siguiente turno, ¡se convierte en una guerra civil! Lo aprenderemos todo despacio, paso a paso.'],
fr:['Lancez les dés.','Appuyez sur Fin du tour.','Touchez l’endroit ou le bouton lumineux à l’écran.','C’est le tour de Coach Bot. Regardez le plateau.','Chaque tuile donne un type de carte. Son numéro est celui du dé. Quand il sort, les villages voisins reçoivent des cartes. Un village vaut 1 point, une ville 2.','Un 7 déclenche la tempête. Qui a plus de 7 cartes en défausse la moitié. Puis vous placez la tempête sur une tuile : elle ne donne plus de cartes et vous volez une carte.','Deux 7 de suite, c’est la guerre civile ! Vous attaquez une tuile et ses bâtiments souffrent. Surveillez la plus longue route et les points. Le premier à 5 gagne.','Les cartes spéciales donnent des pouvoirs : maire, deux routes gratuites, loterie, président et joker. On les achète avec des cartes et on les joue à son tour.','À la banque, échangez quatre cartes identiques contre celle qu’il vous faut. Les ports coûtent moins cher. Vous pouvez aussi échanger avec les joueurs.','Bravo, vous avez gagné ! Vous connaissez villages, routes, dés, le 7, la tempête, la guerre civile, villes, banque, échanges et cartes spéciales. Prêt pour une vraie partie ?','Bienvenue sur Storm Isle ! Vous jouez contre Coach Bot sur une petite île. Dans cette partie d’entraînement, le premier à 5 points gagne. Les vraies parties vont jusqu’à 10 points.','Storm Isle est un jeu où l’on collecte des cartes et où l’on construit. Lancez les dés, recevez des cartes, bâtissez villages, villes et routes. Le grand retournement, c’est le chiffre 7 : un 7 déclenche la tempête, mais si vous refaites un 7 dès votre tour suivant, c’est la guerre civile ! Nous apprendrons tout doucement, étape par étape.'],
bn:["ডাইস রোল করুন।", "এন্ড টার্ন বাটনে চাপ দিন।", "স্ক্রিনে যেখানে জ্বলজ্বল করছে, সেখানে বা বাটনে ট্যাপ করুন।", "এখন Coach Bot-এর টার্ন। বোর্ডটা দেখুন।", "প্রতিটা টাইল এক ধরনের কার্ড দেয়। টাইলের নম্বরটাই ডাইসের নম্বর। ওই নম্বর এলে পাশের টাউনগুলো কার্ড পায়। টাউনের জন্য এক পয়েন্ট, সিটির জন্য দুই পয়েন্ট।", "ডাইসে সাত এলে স্টর্ম আসে। যার সাতটার বেশি কার্ড আছে, তাকে অর্ধেক ফেলে দিতে হয়। তারপর আপনি স্টর্মটা একটা টাইলের ওপর বসান। ওই টাইল আর কার্ড দেয় না, আর আপনি অন্য কারও একটা কার্ড নিয়ে নিতে পারেন।", "পরপর দুবার সাত এলে সিভিল ওয়ার! আপনি একটা টাইলে অ্যাটাক করতে পারেন, সেখানকার বিল্ডিংগুলো নষ্ট হয়ে যায়। লংগেস্ট রোড আর পয়েন্টের দিকে নজর রাখুন। যে আগে পাঁচ পয়েন্ট পাবে, সে জিতবে।", "স্পেশাল কার্ডে স্পেশাল পাওয়ার পাওয়া যায়: মেয়র, দুটো ফ্রি রোড, লটারি, প্রেসিডেন্ট আর জোকার। কার্ড দিয়ে কিনুন, নিজের টার্নে ব্যবহার করুন।", "ব্যাংকে একই রকম চারটা কার্ড দিয়ে আপনার পছন্দের একটা কার্ড নিন। পোর্টের কাছে হলে কম কার্ডেই হয়ে যায়। অন্য প্লেয়ারদের সঙ্গেও ট্রেড করতে পারেন।", "অভিনন্দন, আপনি জিতে গেছেন! এখন আপনি টাউন, রোড, ডাইস, সাত, স্টর্ম, সিভিল ওয়ার, সিটি, ব্যাংক, ট্রেডিং আর স্পেশাল কার্ড সবই জানেন। আসল গেম খেলতে রেডি?", "Storm Isle-এ স্বাগতম! একটা ছোট আইল্যান্ডে আপনি Coach Bot-এর বিরুদ্ধে খেলবেন। এই প্র্যাকটিস গেমে যে আগে পাঁচ পয়েন্ট পাবে, সে জিতবে। আসল গেম দশ পয়েন্ট পর্যন্ত চলে।", "এটা কার্ড জমিয়ে বানানোর গেম। ডাইস রোল করুন, কার্ড নিন, টাউন, সিটি আর রোড বানান। সাত এলে স্টর্ম। কিন্তু পরের টার্নেই আবার সাত এলে সিভিল ওয়ার! সবকিছু আমরা ধাপে ধাপে শিখব।"],
pt:['Role os dados.','Toque em Terminar turno.','Toque no ponto ou botão brilhante na tela.','É a vez do Coach Bot. Observe o tabuleiro.','Cada peça dá um tipo de carta. O número dela é o número do dado. Quando sai, as vilas ao lado recebem cartas. Uma vila vale 1 ponto e uma cidade, 2.','Um 7 é uma tempestade. Quem tem mais de 7 cartas descarta metade. Depois você coloca a tempestade numa peça: ela para de dar cartas e você rouba uma carta.','Dois 7 seguidos são uma guerra civil! Você escolhe uma peça para atacar e as construções dela sofrem. Fique de olho na maior estrada e nos pontos. Quem chegar a 5 primeiro vence.','As cartas especiais dão poderes: prefeito, duas estradas grátis, loteria, presidente e coringa. Compre com cartas e jogue no seu turno.','No banco, troque quatro cartas iguais por uma que precisa. Os portos saem mais baratos. Você também pode trocar com outros jogadores.','Parabéns, você venceu! Agora você conhece vilas, estradas, dados, o 7, a tempestade, a guerra civil, cidades, banco, comércio e cartas especiais. Pronto para uma partida real?','Bem-vindo ao Storm Isle! Você joga contra o Coach Bot numa ilha pequena. Neste jogo de treino, vence quem chegar primeiro a 5 pontos. Os jogos de verdade vão até 10.','Storm Isle é um jogo de juntar cartas e construir. Role os dados, receba cartas e construa vilas, cidades e estradas. A grande virada é o número 7: um 7 é uma tempestade, mas se você tirar outro 7 na sua próxima vez, vira uma guerra civil! Vamos aprender tudo devagar, passo a passo.'],
id:['Lempar dadu.','Tekan Akhiri giliran.','Ketuk tempat atau tombol yang menyala di layar.','Sekarang giliran Coach Bot. Perhatikan papan.','Setiap petak memberi satu jenis kartu. Angkanya adalah angka dadu. Jika keluar, desa di sebelahnya mendapat kartu. Desa bernilai 1 poin, kota 2 poin.','Angka 7 berarti badai. Pemain dengan lebih dari 7 kartu membuang setengahnya. Lalu Anda menaruh badai di satu petak: petak itu berhenti memberi kartu dan Anda mencuri satu kartu.','Dua kali 7 berturut-turut adalah perang sipil! Anda memilih petak untuk diserang dan bangunannya rusak. Perhatikan jalan terpanjang dan poin. Yang lebih dulu mencapai 5 poin menang.','Kartu spesial memberi kekuatan: wali kota, dua jalan gratis, undian, presiden, dan joker. Beli dengan kartu dan mainkan di giliran Anda.','Di bank, tukar empat kartu yang sama dengan satu kartu yang Anda butuhkan. Pelabuhan lebih murah. Anda juga bisa bertukar dengan pemain lain.','Selamat, Anda menang! Sekarang Anda tahu desa, jalan, dadu, angka 7, badai, perang sipil, kota, bank, perdagangan, dan kartu spesial. Siap main sungguhan?','Selamat datang di Storm Isle! Anda bermain melawan Coach Bot di sebuah pulau kecil. Di permainan latihan ini, pemain pertama yang meraih 5 poin menang. Permainan sungguhan sampai 10 poin.','Storm Isle adalah permainan mengumpulkan kartu dan membangun. Lempar dadu, ambil kartu, lalu bangun desa, kota, dan jalan. Kejutan besarnya ada pada angka 7: satu kali 7 berarti badai, tetapi jika Anda mendapat 7 lagi di giliran berikutnya, itu menjadi perang sipil! Kita akan belajar semuanya pelan-pelan, selangkah demi selangkah.'],
te:["డైస్ రోల్ చేయండి.", "ఎండ్ టర్న్ బటన్ నొక్కండి.", "స్క్రీన్ మీద మెరుస్తున్న చోట లేదా బటన్ మీద నొక్కండి.", "ఇప్పుడు Coach Bot టర్న్. బోర్డ్ చూడండి.", "ప్రతి టైల్ ఒక రకం కార్డ్ ఇస్తుంది. టైల్ మీద ఉన్న నంబరే డైస్ నంబర్. ఆ నంబర్ వస్తే, పక్కనున్న టౌన్‌లకు కార్డ్స్ వస్తాయి. టౌన్‌కి ఒక పాయింట్, సిటీకి రెండు పాయింట్లు.", "డైస్‌లో ఏడు వస్తే స్టార్మ్ వస్తుంది. ఏడు కంటే ఎక్కువ కార్డ్స్ ఉన్నవాళ్లు సగం పడేయాలి. తర్వాత మీరు స్టార్మ్‌ని ఒక టైల్ మీద పెట్టాలి. ఆ టైల్ కార్డ్స్ ఇవ్వడం ఆపేస్తుంది, మీరు ఒకరి దగ్గర నుంచి ఒక కార్డ్ తీసుకోవచ్చు.", "వరసగా రెండుసార్లు ఏడు వస్తే సివిల్ వార్! మీరు ఒక టైల్ మీద అటాక్ చేయవచ్చు, అక్కడి బిల్డింగ్స్ పాడవుతాయి. లాంగెస్ట్ రోడ్, పాయింట్స్ మీద ఒక కన్నేసి ఉంచండి. ముందు ఐదు పాయింట్లు తెచ్చుకున్నవాళ్లు గెలుస్తారు.", "స్పెషల్ కార్డ్స్ స్పెషల్ పవర్స్ ఇస్తాయి: మేయర్, రెండు ఫ్రీ రోడ్స్, లాటరీ, ప్రెసిడెంట్, జోకర్. కార్డ్స్ ఇచ్చి కొనండి, మీ టర్న్‌లో వాడండి.", "బ్యాంక్‌లో ఒకే రకం నాలుగు కార్డ్స్ ఇచ్చి, మీకు కావాల్సిన ఒక కార్డ్ తీసుకోండి. పోర్ట్ దగ్గర ఉంటే తక్కువ కార్డ్స్ చాలు. ఇతర ప్లేయర్స్‌తో కూడా ట్రేడ్ చేయవచ్చు.", "కంగ్రాట్స్, మీరు గెలిచారు! ఇప్పుడు మీకు టౌన్, రోడ్, డైస్, ఏడు, స్టార్మ్, సివిల్ వార్, సిటీ, బ్యాంక్, ట్రేడింగ్, స్పెషల్ కార్డ్స్ అన్నీ తెలుసు. రియల్ గేమ్ ఆడటానికి రెడీనా?", "Storm Isle కి స్వాగతం! ఒక చిన్న ఐలాండ్‌లో మీరు Coach Bot తో ఆడతారు. ఈ ప్రాక్టీస్ గేమ్‌లో ముందు ఐదు పాయింట్లు తెచ్చుకున్నవాళ్లు గెలుస్తారు. రియల్ గేమ్‌లో పది పాయింట్ల వరకు ఆడతారు.", "ఇది కార్డ్స్ కలెక్ట్ చేసి కట్టుకునే గేమ్. డైస్ రోల్ చేయండి, కార్డ్స్ తీసుకోండి, టౌన్స్, సిటీస్, రోడ్స్ కట్టండి. ఏడు వస్తే స్టార్మ్. కానీ తర్వాతి టర్న్‌లోనే మళ్లీ ఏడు వస్తే సివిల్ వార్! అన్నీ ఒక్కొక్కటిగా నేర్చుకుందాం."],
ta:["டைஸ் ரோல் பண்ணுங்கள்.", "என்ட் டர்ன் பட்டனை அழுத்துங்கள்.", "ஸ்கிரீனில் மின்னும் இடத்தை அல்லது பட்டனைத் தொடுங்கள்.", "இப்போது Coach Bot-இன் டர்ன். போர்டைப் பாருங்கள்.", "ஒவ்வொரு டைலும் ஒரு வகை கார்டு கொடுக்கும். டைலில் இருக்கும் நம்பர்தான் டைஸ் நம்பர். அந்த நம்பர் வந்தால் பக்கத்தில் இருக்கும் டவுனுக்கு கார்டு கிடைக்கும். டவுனுக்கு ஒரு பாயிண்ட், சிட்டிக்கு இரண்டு பாயிண்ட்.", "டைஸில் ஏழு வந்தால் ஸ்டார்ம் வரும். ஏழுக்கு மேல் கார்டு வைத்திருப்பவர்கள் பாதியைப் போட்டுவிட வேண்டும். அப்புறம் நீங்கள் ஸ்டார்மை ஒரு டைலில் வைக்க வேண்டும். அந்த டைல் கார்டு கொடுக்காது, நீங்கள் ஒருவரிடம் இருந்து ஒரு கார்டை எடுத்துக்கொள்ளலாம்.", "அடுத்தடுத்து இரண்டு முறை ஏழு வந்தால் சிவில் வார்! நீங்கள் ஒரு டைலை அட்டாக் பண்ணலாம், அங்கே இருக்கும் பில்டிங்ஸ் சேதமாகும். லாங்கெஸ்ட் ரோடு, பாயிண்ட்ஸ் கவனமாகப் பாருங்கள். முதலில் ஐந்து பாயிண்ட் எடுப்பவர் ஜெயிப்பார்.", "ஸ்பெஷல் கார்டுகள் ஸ்பெஷல் பவர் கொடுக்கும்: மேயர், இரண்டு ஃப்ரீ ரோடு, லாட்டரி, பிரசிடென்ட், ஜோக்கர். கார்டு கொடுத்து வாங்கி, உங்கள் டர்னில் பயன்படுத்துங்கள்.", "பேங்கில் ஒரே மாதிரி நான்கு கார்டு கொடுத்து, உங்களுக்கு வேண்டிய ஒரு கார்டை வாங்கலாம். போர்ட் பக்கத்தில் இருந்தால் குறைவான கார்டு போதும். மற்ற பிளேயர்களிடமும் டிரேட் பண்ணலாம்.", "வாழ்த்துகள், நீங்கள் ஜெயித்துவிட்டீர்கள்! இப்போது உங்களுக்கு டவுன், ரோடு, டைஸ், ஏழு, ஸ்டார்ம், சிவில் வார், சிட்டி, பேங்க், டிரேடிங், ஸ்பெஷல் கார்டு எல்லாமே தெரியும். ரியல் கேம் விளையாட ரெடியா?", "Storm Isle-க்கு வரவேற்கிறோம்! ஒரு சின்ன தீவில் நீங்கள் Coach Bot-உடன் விளையாடுவீர்கள். இந்த பிராக்டிஸ் கேமில் முதலில் ஐந்து பாயிண்ட் எடுப்பவர் ஜெயிப்பார். ரியல் கேமில் பத்து பாயிண்ட் வரை விளையாடுவார்கள்.", "இது கார்டுகளைச் சேகரித்துக் கட்டுகிற கேம். டைஸ் ரோல் பண்ணுங்கள், கார்டு எடுங்கள், டவுன், சிட்டி, ரோடு கட்டுங்கள். ஏழு வந்தால் ஸ்டார்ம். ஆனால் அடுத்த டர்னிலேயே மறுபடியும் ஏழு வந்தால் சிவில் வார்! எல்லாவற்றையும் ஒவ்வொன்றாகக் கற்றுக்கொள்வோம்."],
kn:["ಡೈಸ್ ರೋಲ್ ಮಾಡಿ.", "ಎಂಡ್ ಟರ್ನ್ ಬಟನ್ ಒತ್ತಿ.", "ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಮಿಂಚುತ್ತಿರುವ ಜಾಗದ ಮೇಲೆ ಅಥವಾ ಬಟನ್ ಮೇಲೆ ಟ್ಯಾಪ್ ಮಾಡಿ.", "ಈಗ Coach Bot ಟರ್ನ್. ಬೋರ್ಡ್ ನೋಡಿ.", "ಪ್ರತಿ ಟೈಲ್ ಒಂದು ತರದ ಕಾರ್ಡ್ ಕೊಡುತ್ತದೆ. ಟೈಲ್ ಮೇಲಿರುವ ನಂಬರ್ ಡೈಸ್ ನಂಬರ್. ಆ ನಂಬರ್ ಬಂದರೆ, ಪಕ್ಕದಲ್ಲಿರುವ ಟೌನ್‌ಗೆ ಕಾರ್ಡ್ ಸಿಗುತ್ತದೆ. ಟೌನ್‌ಗೆ ಒಂದು ಪಾಯಿಂಟ್, ಸಿಟಿಗೆ ಎರಡು ಪಾಯಿಂಟ್.", "ಡೈಸ್‌ನಲ್ಲಿ ಏಳು ಬಂದರೆ ಸ್ಟಾರ್ಮ್ ಬರುತ್ತದೆ. ಏಳಕ್ಕಿಂತ ಜಾಸ್ತಿ ಕಾರ್ಡ್ ಇರುವವರು ಅರ್ಧ ಕಾರ್ಡ್ ಬಿಸಾಕಬೇಕು. ಆಮೇಲೆ ನೀವು ಸ್ಟಾರ್ಮ್ ಅನ್ನು ಒಂದು ಟೈಲ್ ಮೇಲೆ ಇಡಬೇಕು. ಆ ಟೈಲ್ ಕಾರ್ಡ್ ಕೊಡುವುದು ನಿಲ್ಲಿಸುತ್ತದೆ, ಮತ್ತು ನೀವು ಬೇರೆಯವರ ಒಂದು ಕಾರ್ಡ್ ತಗೊಳ್ಳಬಹುದು.", "ಒಂದರ ಹಿಂದೆ ಒಂದು ಎರಡು ಸಲ ಏಳು ಬಂದರೆ ಸಿವಿಲ್ ವಾರ್! ನೀವು ಒಂದು ಟೈಲ್ ಮೇಲೆ ಅಟ್ಯಾಕ್ ಮಾಡಬಹುದು, ಅಲ್ಲಿರುವ ಬಿಲ್ಡಿಂಗ್ಸ್ ಹಾಳಾಗುತ್ತವೆ. ಲಾಂಗೆಸ್ಟ್ ರೋಡ್ ಮತ್ತು ಪಾಯಿಂಟ್ಸ್ ಕಡೆ ಗಮನ ಇರಲಿ. ಮೊದಲು ಐದು ಪಾಯಿಂಟ್ ತಗೊಂಡವರು ಗೆಲ್ಲುತ್ತಾರೆ.", "ಸ್ಪೆಷಲ್ ಕಾರ್ಡ್‌ಗಳು ಸ್ಪೆಷಲ್ ಪವರ್ ಕೊಡುತ್ತವೆ: ಮೇಯರ್, ಎರಡು ಫ್ರೀ ರೋಡ್, ಲಾಟರಿ, ಪ್ರೆಸಿಡೆಂಟ್ ಮತ್ತು ಜೋಕರ್. ಕಾರ್ಡ್ ಕೊಟ್ಟು ಇವುಗಳನ್ನು ಖರೀದಿಸಿ, ನಿಮ್ಮ ಟರ್ನ್‌ನಲ್ಲಿ ಉಪಯೋಗಿಸಿ.", "ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಒಂದೇ ತರದ ನಾಲ್ಕು ಕಾರ್ಡ್ ಕೊಟ್ಟು, ನಿಮಗೆ ಬೇಕಾದ ಒಂದು ಕಾರ್ಡ್ ತಗೊಳ್ಳಿ. ಪೋರ್ಟ್ ಹತ್ತಿರ ಇದ್ದರೆ ಕಡಿಮೆ ಕಾರ್ಡ್ ಸಾಕು. ಬೇರೆ ಪ್ಲೇಯರ್ಸ್ ಜೊತೆನೂ ಟ್ರೇಡ್ ಮಾಡಬಹುದು.", "ಕಂಗ್ರಾಟ್ಸ್, ನೀವು ಗೆದ್ದಿರಿ! ಈಗ ನಿಮಗೆ ಟೌನ್, ರೋಡ್, ಡೈಸ್, ಏಳು, ಸ್ಟಾರ್ಮ್, ಸಿವಿಲ್ ವಾರ್, ಸಿಟಿ, ಬ್ಯಾಂಕ್, ಟ್ರೇಡಿಂಗ್ ಮತ್ತು ಸ್ಪೆಷಲ್ ಕಾರ್ಡ್ ಎಲ್ಲಾ ಗೊತ್ತು. ರಿಯಲ್ ಗೇಮ್ ಆಡಲು ರೆಡಿ ಇದ್ದೀರಾ?", "Storm Isle ಗೆ ಸ್ವಾಗತ! ಒಂದು ಚಿಕ್ಕ ಐಲ್ಯಾಂಡ್‌ನಲ್ಲಿ ನೀವು Coach Bot ವಿರುದ್ಧ ಆಡುತ್ತೀರಿ. ಈ ಪ್ರ್ಯಾಕ್ಟೀಸ್ ಗೇಮ್‌ನಲ್ಲಿ ಮೊದಲು ಐದು ಪಾಯಿಂಟ್ ತಗೊಂಡವರು ಗೆಲ್ಲುತ್ತಾರೆ. ರಿಯಲ್ ಗೇಮ್‌ನಲ್ಲಿ ಹತ್ತು ಪಾಯಿಂಟ್ ತನಕ ಆಡುತ್ತಾರೆ.", "ಇದು ಕಾರ್ಡ್ ಕಲೆಕ್ಟ್ ಮಾಡಿ ಕಟ್ಟುವ ಗೇಮ್. ಡೈಸ್ ರೋಲ್ ಮಾಡಿ, ಕಾರ್ಡ್ ತಗೊಳ್ಳಿ, ಟೌನ್, ಸಿಟಿ, ರೋಡ್ ಕಟ್ಟಿ. ಏಳು ಬಂದರೆ ಸ್ಟಾರ್ಮ್. ಆದರೆ ಮುಂದಿನ ಟರ್ನ್‌ನಲ್ಲೂ ಮತ್ತೆ ಏಳು ಬಂದರೆ ಸಿವಿಲ್ ವಾರ್! ಎಲ್ಲವನ್ನೂ ಒಂದೊಂದಾಗಿ ಕಲಿಯೋಣ."],
zh:['请掷骰子。','点击结束回合。','点击屏幕上发光的位置或按钮。','现在是 Coach Bot 的回合，请看棋盘。','每块地块产出一种卡牌，地块上的数字就是骰子点数。掷出该点数时，相邻的城镇获得卡牌。城镇 1 分，城市 2 分。','掷出 7 就是风暴。手牌超过 7 张的人要弃掉一半。然后你把风暴放到一块地块上：它不再产出卡牌，你还能偷一张牌。','连续两次掷出 7 就是内战！你选择攻击一块地块，那里的建筑会受损。注意最长道路和分数。先拿到 5 分的人获胜。','特殊卡带来能力：市长、两条免费道路、彩票、总统和小丑。用卡牌购买，在自己的回合使用。','在银行用四张相同的卡换一张你需要的卡，港口更便宜。你也可以和其他玩家交易。','恭喜获胜！你已经学会城镇、道路、骰子、7、风暴、内战、城市、银行、交易和特殊卡。准备好真正开局了吗？','欢迎来到 Storm Isle！你将在一座小岛上与 Coach Bot 对战。这局练习赛中，先拿到 5 分的人获胜。正式比赛打到 10 分。','Storm Isle 是一款收集卡牌和建造的游戏。掷骰子，拿卡牌，建造城镇、城市和道路。最大的转折是数字 7：掷出一次 7 是风暴，但如果下一回合你又掷出 7，就会变成内战！我们会慢慢来，一步一步学。']};
function vtopic(i){
  const st=TSTEPS[i],al=(st&&st.al)||[];
  if(i>=TSTEPS.length-1)return 9;
  if(al.includes('roll'))return 0;if(al.includes('end'))return 1;if(al.length)return 2;
  if([6,14,18,28,33,39,64].includes(i))return 3;

is memilih ukuran yang cocok dengan jumlah pemain.","自动选择适合玩家人数的大小。","ऑटो खिलाड़ियों की संख्या के हिसाब से आकार चुनता है।","অটো খেলোয়াড়ের সংখ্যা অনুযায়ী আকার বেছে নেয়।","ఆటగాళ్ల సంఖ్యకు తగ్గ పరిమాణాన్ని ఆటో ఎంచుకుంటుంది.","வீரர்களின் எண்ணிக்கைக்கு ஏற்ற அளவை ஆட்டோ தேர்ந்தெடுக்கும்.","ಆಟಗಾರರ ಸಂಖ್ಯೆಗೆ ತಕ್ಕ ಗಾತ್ರವನ್ನು ಸ್ವಯಂ ಆಯ್ಕೆ ಮಾಡುತ್ತದೆ."],": {n} tiles.":[": {1} casillas.",": {1} tuiles.",": {1} peças.",": {1} petak.",": {1} 个地块。",": {1} टाइलें।",": {1}টি টাইল।",": {1} టైల్స్.",": {1} ஓடுகள்.",": {1} ಟೈಲ್‌ಗಳು."],"Easy: bots play loosely and make mistakes, rarely trade and pick random tiles. {n} lakes ({n} on the small board) and roads survive disasters.":["Fácil: los bots juegan sin cuidado y cometen errores, comercian poco y eligen casillas al azar. {1} lagos ({2} en el tablero pequeño) y los caminos sobreviven a los desastres.","Facile : les bots jouent à la légère et font des erreurs, échangent rarement et choisissent des tuiles au hasard. {1} lacs ({2} sur le petit plateau) et les routes survivent aux catastrophes.","Fácil: os bots jogam sem cuidado e cometem erros, raramente trocam e escolhem peças aleatórias. {1} lagos ({2} no tabuleiro pequeno) e as estradas sobrevivem aos desastres.","Mudah: bot bermain santai dan sering salah, jarang berdagang, dan memilih petak secara acak. {1} danau ({2} di papan kecil) dan jalan selamat dari bencana.","简单：机器人打得随意、会犯错，很少交易，随机选择地块。有 {1} 个湖泊（小地图 {2} 个），道路不会被灾难摧毁。","आसान: बॉट ढीला खेलते हैं और गलतियाँ करते हैं, कम व्यापार करते हैं और टाइलें यूँ ही चुनते हैं। {1} झीलें (छोटे बोर्ड पर {2}) और सड़कें आपदाओं में बची रहती हैं।","সহজ: বটরা ঢিলেঢালা খেলে ও ভুল করে, কমই বাণিজ্য করে এবং এলোমেলো টাইল বেছে নেয়। {1}টি হ্রদ (ছোট বোর্ডে {2}টি) এবং রাস্তা দুর্যোগে টিকে থাকে।","సులభం: బాట్‌లు నిర్లక్ష్యంగా ఆడతాయి, తప్పులు చేస్తాయి, అరుదుగా వ్యాపారం చేస్తాయి, యాదృచ్ఛికంగా టైల్స్ ఎంచుకుంటాయి. {1} సరస్సులు (చిన్న బోర్డులో {2}) మరియు రోడ్లు విపత్తులను తట్టుకుంటాయి.","எளிது: பாட்கள் அலட்சியமாக விளையாடி தவறு செய்யும், அரிதாக வர்த்தகம் செய்யும ees it until it wins you the game.":["Secreto: vale {1} punto. Nadie lo ve hasta que te hace ganar la partida.","Secret : vaut {1} point. Personne ne le voit avant qu'il ne vous fasse gagner.","Segredo: vale {1} ponto. Ninguém vê até ele te dar a vitória.","Rahasia: bernilai {1} poin. Tak ada yang melihatnya sampai membuat Anda menang.","秘密：价值 {1} 分。在帮你赢下游戏之前无人可见。","गुप्त: {1} अंक का। जब तक यह आपको जिताता नहीं, कोई नहीं देखता।","গোপন: {1} পয়েন্টের। এটি জিতিয়ে না দেওয়া পর্যন্ত কেউ দেখে না।","రహస్యం: {1} పాయింట్ విలువ. ఇది మిమ్మల్ని గెలిపించే వరకు ఎవరూ చూడరు.","ரகசியம்: {1} புள்ளி மதிப்பு. இது உங்களை வெல்ல வைக்கும் வரை யாரும் பார்க்க மாட்டார்கள்.","ರಹಸ್ಯ: {1} ಅಂಕ ಮೌಲ್ಯ. ಇದು ನಿಮ್ಮನ್ನು ಗೆಲ್ಲಿಸುವವರೆಗೆ ಯಾರೂ ನೋಡುವುದಿಲ್ಲ."],"Bank swap: {n} same cards for {n} ({n} with a general port, {n} with a matching port)":["Cambio con el banco: {1} cartas iguales por {2} ({3} con puerto general, {4} con puerto específico)","Échange bancaire : {1} cartes identiques pour {2} ({3} avec un port général, {4} avec un port assorti)","Troca com o banco: {1} cartas iguais por {2} ({3} com porto geral, {4} com porto específico)","Tukar dengan bank: {1} kartu sama untuk {2} ({3} dengan pelabuhan umum, {4} dengan pelabuhan sesuai)","银行兑换：{1} 张相同的牌换 {2} 张（普通港口 {3}，对应港口 {4}）","बैंक अदला-बदली: {1} एक जैसे कार्ड के बदले {2} (सामान्य बंदरगाह पर {3}, मेल खाते बंदरगाह पर {4})","ব্যাংক বিনিময়: {1}টি একই কার্ডে {2} (সাধারণ বন্দরে {3}, মিলে যাওয়া বন্দরে {4})","బ్యాంక్ మార్పిడి: {1} ఒకే రకం కార్డులకు {2} (సాధారణ ఓడరేవుతో {3}, సరిపోలే ఓడరేవుతో {4})","வங்கி மாற்றம்: {1} ஒரே அட்டைகளுக்கு {2} (பொது துறைமுகத்தில் {3}, பொருந்தும் துறைமுகத்தில் {4})","ಬ್ಯಾಂಕ್ ವಿನಿಮಯ: {1} ಒಂದೇ ರೀತಿಯ ಕಾರ್ಡ್‌ಗಳಿಗೆ {2} (ಸಾಮಾನ್ಯ ಬಂದರಿನಲ್ಲಿ {3}, ಹೊಂದುವ ಬಂದರಿನಲ್ಲಿ {4})"],"A {n} stops one tile from paying out, and you steal {n} card from a player beside it.":["Un {1} impide que una casilla produzca, y robas {2} carta a un jugador a su lado.","Un {1} empêche une tuile de rapporter, et vous volez {2} carte à un joueur voisin.","Um {1} impede uma peça de render, e você rouba {2} carta de um jogador ao lado.","Angka {1} menghentikan satu petak menghasilkan, dan Anda mencuri {2} kartu dari pemain di sebelahnya.","掷出 {1} 会让一个地块停产，并可从相邻玩家处偷 {2} 张牌。","{1} एक टाइल का उत्पादन रोक देता है, और आप पास के खिलाड़ी से {2} कार्ड चुराते हैं।","{1} একটি টাইলের উৎপাদন বন্ধ করে, আর আপনি পাশের খেলোয়াড়ের কাছ থেকে {2}টি কার্ড চুরি করেন।","{1} ఒక టైల్ ఉత్పత్తిని ఆపుతుంది, పక్కన ఉన్న ఆటగాడి నుండి మీరు {2} కార్డు దొంగిలిస్తారు.","{1} ஒரு ஓட்டின் உற்பத்தியை நிறுத்தும், அருகிலுள்ள வீரரிடமிருந்து {2} அட்டையைத் திருடலாம்.","{1} ಒಂದು ಟೈಲ್‌ನ ಉತ್ಪಾದನೆ ನಿಲ್ಲಿಸುತ್ತದೆ, ಪಕ್ಕದ ಆಟಗಾರನಿಂದ {2} ಕಾರ್ಡ್ ಕದಿಯುತ್ತೀರಿ."],"Every round a random event shakes things up, from windfalls to double harvests to audits.":["Cada ronda un evento aleatorio sacude el juego: desde golpes de suerte hasta cosechas dobles o auditorías.","À chaque tour, un événement aléatoire bouscule tout : aubaines, doubles récoltes, contrôles.","A cada rodada um evento aleatório agita o jogo: de golpes de sorte a colheitas duplas e auditorias.","Setiap ronde, peristiwa acak mengubah keadaan, dari rezeki nomplok hingga panen ganda dan audit.","每回合都有随机事件搅动局势，从意外之财到双倍收成再到审计。","हर राउंड एक यादृच्छिक घटना खेल हिला देती है, अचानक लाभ से लेकर दोगुनी फ़सल और ऑडिट तक।","প্রতি রাউন্ডে একটি এলোমেলো ঘটনা সবকিছু ওলটপালট করে, হঠাৎ লাভ থেকে দ্বিগুণ ফসল ও অডিট পর্যন্ত।","ప్రతి రౌండ్‌లో ఒక యాదృచ్ఛిక ఘటన పరిస్థితిని మారుస్తుంది: అదృష్టం నుండి రెట్టింపు పంట, ఆడిట్ వరకు.","ஒவ்வொரு சுற்றிலும் ஒரு தற்செயல் நிகழ்வு நிலையை மாற்றும்: திடீர் லாபம் முதல் இரட்டை அறுவடை, தணிக்கை வரை.","ಪ್ರತಿ ಸುತ್ತಿನಲ್ಲೂ ಒಂದು ಯಾದೃಚ್ಛಿಕ ಘಟನೆ ಪರಿಸ್ಥಿತಿ ಬದಲಿಸುತ್ತದೆ: ಅದೃಷ್ಟದಿಂದ ಎರಡು ಪಟ್ಟು ಫಸಲು, ಲೆಕ್ಕಪರಿಶೋಧನೆ ವರೆಗೆ."],"A random card is taken from the player you pick. You can also tap their glowing town on the board.":["Se toma una carta al azar del jugador que elijas. También puedes tocar su pueblo brillante en el tablero.","Une carte au hasard est prise au joueur choisi. Vous pouvez aussi toucher son village lumineux sur le plateau.","Uma carta aleatória é tirada do jogador escolhido. Você também pode tocar na vila brilhante dele no tabuleiro.","Satu kartu acak diambil dari pemain yang Anda pilih. Anda juga bisa mengetuk kota kecilnya yang bersinar di papan.","会从你选择的玩家那里随机拿走一张牌。你也可以点按棋盘上其发光的村庄。","चुने गए खिलाड़ी से एक यादृच्छिक कार्ड लिया जाता है। आप बोर्ड पर उसके चमकते कस्बे को भी टैप कर सकते हैं।","আপনার বাছাই করা খেলোয়াড়ের কাছ থেকে একটি এলোমেলো কার্ড নেওয়া হয়। বোর্ডে তার জ্বলজ্বলে শহরেও ট্যাপ করতে পারেন।","మీరు ఎంచుకున్న ఆటగాడి నుండి యాదృచ్ఛిక కార్డు తీసుకుంటారు. బోర్డులో వారి మెరిసే పట్టణాన్ని కూడా నొక్కవచ్చు.","நீங்கள் தேர்ந்தெடுத்த வீரரிடமிருந்து ஒரு தற்செயல் அட்டை எடுக்கப்படும். பலகையில் அவரது ஒளிரும் நகரத்தையும் தட்டலாம்.","ನೀವು ಆರಿಸಿದ ಆಟಗಾರನಿಂದ ಯಾದೃಚ್ಛಿಕ ಕಾರ್ಡ್ ತೆಗೆದುಕೊಳ್ಳಲಾಗುತ್ತದೆ. ಬೋರ್ಡ್‌ನಲ್ಲಿ ಅವರ ಹೊಳೆಯುವ ಪಟ್ಟಣವನ್ನೂ ಟ್ಯಾಪ್ ಮಾಡಬಹುದು."],"Piece limits on this board: {n} towns, {n} cities, {n} roads per player. A city gives its town piece back.":["Límite de piezas en este tablero: {1} pueblos, {2} ciudades, {3} caminos por jugador. Una ciudad devuelve su pieza de pueblo.","Limites de pièces sur ce plateau : {1} villages, {2} villes, {3} routes par joueur. Une ville rend sa pièce de village.","Limite de peças neste tabuleiro: {1} vilas, {2} cidades, {3} estradas por jogador. Uma cidade devolve a peça de vila.","Batas bidak di papan ini: {1} kota kecil, {2} kota, {3} jalan per pemain. Kota mengembalikan bidak kota kecilnya.","此棋盘的棋子上限：每位玩家 {1} 个村庄、{2} 座城市、{3} 条道路。城市会归还其村庄棋子。","इस बोर्ड पर टुकड़ों की सीमा: प्रति खिलाड़ी {1} कस्बे, {2} शहर, {3} सड़कें। शहर अपना कस्बे का टुकड़ा लौटा देता है।","এই বোর্ডে টুকরোর সীমা: প্রতি খেলোয়াড় {1}টি শহর, {2}টি নগর, {3}টি রাস্তা। নগর তার শহরের টুকরো ফিরিয়ে দেয়।","ఈ బోర్డులో ముక్కల పరిమితి: ఒక్కో ఆటగాడికి {1} పట్టణాలు, {2} నగరాలు, {3} రోడ్లు. నగరం తన పట్టణ ముక్కను తిరిగి ఇస్తుంది.","இந்தப் பலகையில் துண்டு வரம்பு: ஒரு வீரருக்கு {1} நகரங்கள், {2} மாநகரங்கள், {3} சாலைகள். மாநகரம் தன் நகரத் துண்டைத் திருப்பித் தரும்.","ಈ ಬೋರ್ಡ್‌ನಲ್ಲಿ ತುಣುಕು ಮಿತಿ: ಪ್ರತಿ ಆಟಗಾರನಿಗೆ {1} ಪಟ್ಟಣ, {2} ನಗರ, {3} ರಸ್ತೆ. ನಗರ ತನ್ನ ಪಟ್ಟಣದ ತುಣುಕನ್ನು ಹಿಂತಿರುಗಿಸುತ್ತದೆ."],"You don't have any resources to trade yet. Roll the dice or build next to producing tiles to collect some.":["Aún no tienes recursos para comerciar. Tira los dados o construye junto a casillas productivas para conseguir algunos.","Vous n'avez pas encore de ressources à échanger. Lancez les dés ou construisez près de tuiles productives pour en obtenir.","Você ainda não tem recursos para trocar. Jogue os dados ou construa perto de peças produtivas para conseguir alguns.","Anda belum punya sumber daya untuk didagangkan. Lempar dadu atau bangun di dekat petak penghasil untuk mengumpulkannya.","你还没有可交易的资源。掷骰子，或在产出地块旁建造来获取资源。","आपके पास अभी व्यापार के लिए कोई संसाधन नहीं है। कुछ पाने के लिए पासे फेंकें या उत्पादक टाइलों के पास निर्माण करें।","আপনার কাছে এখনও বাণিজ্য করার মতো সম্পদ নেই। কিছু পেতে পাশা ফেলুন বা উৎপাদনকারী টাইলের পাশে নির্মাণ করুন।","వ్యాపారం చేయడానికి మీ దగ్గర ఇంకా వనరులు లేవు. కొన్ని సేకరించడానికి పాచికలు వేయండి లేదా ఉత్పత్తి చేసే టైల్స్ పక్కన నిర్మించండి.","வர்த்தகம் செய்ய உங்களிடம் இன்னும் வளங்கள் இல்லை. சிலவற்றைப் பெற பகடையை உருட்டுங்கள் அல்லது உற்பத்தி ஓடுகளின் அருகில் கட்டுங்கள்.","ವ್ಯಾಪಾರ ಮಾಡಲು ನಿಮ್ಮಲ್ಲಿ ಇನ್ನೂ ಸಂಪನ್ಮೂಲಗಳಿಲ್ಲ. ಕೆಲವು ಪಡೆಯಲು ದಾಳ ಎಸೆಯಿರಿ ಅಥವಾ ಉತ್ಪಾದಕ ಟೈಲ್‌ಗಳ ಪಕ್ಕ ನಿರ್ಮಿಸಿ."],"to put extra cards to use: swap {n}:{n} with the bank (better with a port) or offer a trade to another player.":["para aprovechar cartas extra: cambia {1}:{2} con el banco (mejor con puerto) u ofrece un trato a otro jugador.","pour utiliser les cartes en trop : échangez {1}:{2} avec la banque (mieux avec un port) ou proposez un échange à un autre joueur.","para aproveitar cartas extras: troque {1}:{2} com o banco (melhor com porto) ou ofereça uma troca a outro jogador.","untuk memanfaatkan kartu ekstra: tukar {1}:{2} dengan bank (lebih baik dengan pelabuhan) atau tawarkan dagang ke pemain lain.","用多余的牌：与银行按 {1}:{2} 兑换（有港口更划算），或向其他玩家提出交易。","अतिरिक्त कार्ड काम में लाने के लिए: बैंक से {1}:{2} में बदलें (बंदरगाह के साथ बेहतर) या किसी और खिलाड़ी को सौदा दें।","বাড়তি কার্ড কাজে লাগাতে: ব্যাংকের সঙ্গে {1}:{2} বিনিময় করুন (বন্দর থাকলে ভালো) বা অন্য খেলোয়াড়কে প্রস্তাব দিন।","అదనపు కార్డులను ఉపయోగించడానికి: బ్యాంక్‌తో {1}:{2} మార్చుకోండి (ఓడరేవుతో మంచిది) లేదా ఇతర ఆటగాడికి ఆఫర్ ఇవ్వండి.","கூடுதல் அட்டைகளைப் பயன்படுத்த: வங்கியுடன் {1}:{2} மாற்றுங்கள் (துறைமுகம் இருந்தால் சிறந்தது) அல்லது மற்றொரு வீரருக்கு சலுகை அளியுங்கள்.","ಹೆಚ್ಚುವರಿ ಕಾರ್ಡ್‌ಗಳನ್ನು ಬಳಸಲು: ಬ್ಯಾಂಕ್‌ನೊಂದಿಗೆ {1}:{2} ವಿನಿಮಯ ಮಾಡಿ (ಬಂದರು ಇದ್ದರೆ ಉತ್ತಮ) ಅಥವಾ ಇನ್ನೊಬ್ಬ ಆಟಗಾರನಿಗೆ ಪ್ರಸ್ತಾವ ಕೊಡಿ."],"You can build and trade on your own turn. Until then you still collect cards when the roll matches a tile next to your towns.":["Puedes construir y comerciar en tu propio turno. Hasta entonces sigues recogiendo cartas cuando la tirada coincide con una casilla junto a tus pueblos.","Vous pouvez construire et échanger à votre tour. D'ici là, vous récoltez des cartes quand le lancer correspond à une tuile près de vos villages.","Você pode construir e trocar na sua vez. Até lá, continua coletando cartas quando o dado coincide com uma peça ao lado das suas vilas.","Anda bisa membangun dan berdagang di giliran sendiri. Sampai saat itu Anda tetap mendapat kartu saat lemparan cocok dengan petak di sebelah kota kecil Anda.","你可以在自己的回合建造和交易。在此之前，只要掷出的点数对应你村庄旁的地块，你仍能获得牌。","आप अपनी बारी पर निर्माण और व्यापार कर सकते हैं। तब तक, जब पासा आपके कस्बों के पास की टाइल से मेल खाता है, आपको कार्ड मिलते रहते हैं।","আপনি নিজের পালায় নির্মাণ ও বাণিজ্য করতে পারেন। তার আগে পর্যন্ত, পাশার সংখ্যা আপনার শহরের পাশের টাইলের সঙ্গে মিললে আপনি কার্ড পান।","మీరు మీ వంతులో నిర్మించవచ్చు, వ్యాపారం చేయవచ్చు. అప్పటి వరకు, పాచిక మీ పట్టణాల పక్కన ఉన్న టైల్‌తో సరిపోతే మీకు కార్డులు వస్తాయి.","நீங்கள் உங்கள் முறையில் கட்டவும் வர்த்தகம் செய்யவும் முடியும். அதுவரை, பகடை உங்கள் நகரங்களின் அருகிலுள்ள ஓட்டுடன் பொருந்தினால் அட்டைகள் கிடைக்கும்.","ನೀವು ನಿಮ್ಮ ಸರದಿಯಲ್ಲಿ ನಿರ್ಮಿಸಬಹುದು, ವ್ಯಾಪಾರ ಮಾಡಬಹುದು. ಅಲ್ಲಿಯವರೆಗೆ, ದಾಳ ನಿಮ್ಮ ಪಟ್ಟಣಗಳ ಪಕ್ಕದ ಟೈಲ್‌ಗೆ ಹೊಂದಿದರೆ ಕಾರ್ಡ್ ಸಿಗುತ್ತದೆ."],"Place the storm on a tile: it stops producing resources, and you steal {n} card from an opponent building there. Click any tile.":["Coloca la tormenta en una casilla: deja de producir recursos y robas {1} carta a un rival que construya allí. Haz clic en cualquier casilla.","Placez la tempête sur une tuile : elle ne produit plus de ressources et vous volez {1} carte à un adversaire qui y construit. Cliquez sur n'importe quelle tuile.","Coloque a tempestade em uma peça: ela para de produzir recursos e você rouba {1} carta de um oponente que construiu ali. Clique em qualquer peça.","Letakkan badai di sebuah petak: petak itu berhenti menghasilkan sumber daya, dan Anda mencuri {1} kartu dari lawan yang membangun di sana. Klik petak mana saja.","把风暴放在一个地块上：它将停止产出资源，你还能从在那里建造的对手那里偷 {1} 张牌。点击任意地块。","तूफ़ान को किसी टाइल पर रखें: वह संसाधन देना बंद कर देती है, और वहाँ निर्माण करने वाले विरोधी से आप {1} कार्ड चुराते हैं। कोई भी टाइल क्लिक करें।","একটি টাইলে ঝড় বসান: এটি সম্পদ উৎপাদন বন্ধ করে, আর সেখানে নির্মাণ করা প্রতিপক্ষের কাছ থেকে আপনি {1}টি কার্ড চুরি করেন। যেকোনো টাইলে ক্লিক করুন।","ఒక టైల్‌పై తుఫానును ఉంచండి: అది వనరుల ఉత్పత్తిని ఆపుతుంది, అక్కడ నిర్మించిన ప్రత్యర్థి నుండి మీరు {1} కార్డు దొంగిలిస్తారు. ఏ టైల్‌నైనా క్లిక్ చేయండి.","ஒரு ஓட்டில் புயலை வையுங்கள்: அது வளங்களை உற்பத்தி செய்வதை நிறுத்தும், அங்கு கட்டிய எதிரியிடமிருந்து {1} அட்டையைத் திருடலாம். எந்த ஓட்டையும் சொடுக்கவும்.","ಒಂದು ಟೈಲ್‌ನಲ್ಲಿ ಬಿರುಗಾಳಿ ಇಡಿ: ಅದು ಸಂಪನ್ಮೂಲ ಉತ್ಪಾದನೆ ನಿಲ್ಲಿಸುತ್ತದೆ, ಅಲ್ಲಿ ನಿರ್ಮಿಸಿದ ಎದುರಾಳಿಯಿಂದ {1} ಕಾರ್ಡ್ ಕದಿಯುತ್ತೀರಿ. ಯಾವುದೇ ಟೈಲ್ ಕ್ಲಿಕ್ ಮಾಡಿ."],"Spend cards on buildings, swap them with the bank or a player, then end your turn. Hold {n} cards or fewer so a {n} cannot make you discard.":["Gasta cartas en construcciones, cámbialas con el banco o un jugador y termina tu turno. Ten {1} cartas o menos para que un {2} no te haga descartar.","Dépensez des cartes en constructions, échangez-les avec la banque ou un joueur, puis finissez votre tour. Gardez {1 escartarlos.","Un {1} est sorti et vous avez plus de {2} cartes. Touchez les ressources pour les défausser.","Saiu {1} e você tem mais de {2} cartas. Toque nos recursos para descartá-los.","Keluar {1} dan Anda memegang lebih dari {2} kartu. Ketuk sumber daya untuk membuangnya.","掷出了 {1}，你手里超过 {2} 张牌。点按资源来弃牌。","{1} आया और आपके पास {2} से ज़्यादा कार्ड हैं। छोड़ने के लिए संसाधनों पर टैप करें।","{1} উঠেছে এবং আপনার হাতে {2}টির বেশি কার্ড। ফেলতে সম্পদে ট্যাপ করুন।","{1} పడింది, మీ దగ్గర {2} కంటే ఎక్కువ కార్డులు ఉన్నాయి. పడేయడానికి వనరులను నొక్కండి.","{1} விழுந்தது, உங்களிடம் {2}க்கு மேல் அட்டைகள் உள்ளன. விட வளங்களைத் தட்டவும்.","{1} ಬಿದ್ದಿದೆ ಮತ್ತು ನಿಮ್ಮಲ್ಲಿ {2}ಕ್ಕಿಂತ ಹೆಚ್ಚು ಕಾರ್ಡ್‌ಗಳಿವೆ. ಬಿಡಲು ಸಂಪನ್ಮೂಲಗಳನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ."],"Do you want to trade? You can swap with the bank. No answer and your turn moves on.":["¿Quieres comerciar? Puedes cambiar con el banco. Si no respondes, tu turno continúa.","Voulez-vous échanger ? Vous pouvez échanger avec la banque. Sans réponse, votre tour continue.","Quer trocar? Você pode trocar com o banco. Sem resposta, seu turno segue.","Mau berdagang? Anda bisa menukar dengan bank. Tanpa jawaban, giliran Anda berlanjut.","想交易吗？你可以与银行兑换。不回应的话，你的回合会继续。","क्या आप व्यापार करना चाहते हैं? आप बैंक से बदल सकते हैं। जवाब न देने पर आपकी बारी आगे बढ़ जाती है।","বাণিজ্য করতে চান? ব্যাংকের সঙ্গে বিনিময় করতে পারেন। উত্তর না দিলে আপনার পালা এগিয়ে যায়।","వ్యాపారం చేయాలనుకుంటున్నారా? బ్యాంక్‌తో మార్చుకోవచ్చు. సమాధానం ఇవ్వకపోతే మీ వంతు ముందుకు సాగుతుంది.","வர்த்தகம் செய்ய விரும்புகிறீர்களா? வங்கியுடன் மாற்றலாம். பதில் இல்லையெனில் உங்கள் முறை தொடரும்.","ವ್ಯಾಪಾರ ಮಾಡಲು ಬಯಸುವಿರಾ? ಬ್ಯಾಂಕ್‌ನೊಂದಿಗೆ ವಿನಿಮಯ ಮಾಡಬಹುದು. ಉತ್ತರಿಸದಿದ್ದರೆ ನಿಮ್ಮ ಸರದಿ ಮುಂದುವರಿಯುತ್ತದೆ."],"The roll decides which tiles pay out: a town beside that number gets {n} card, a city {n}.":["La tirada decide qué casillas pagan: un pueblo junto a ese número recibe {1} carta, una ciudad {2}.","Le lancer décide quelles tuiles rapportent : un village à côté de ce numéro reçoit {1} carte, une ville {2}.","A jogada decide quais peças rendem: uma vila ao lado desse número recebe {1} carta, uma cidade {2}.","Lemparan menentukan petak mana yang menghasilkan: kota kecil di sebelah angka itu mendapat {1} kartu, kota {2}.","掷出的点数决定哪些地块产出：该数字旁的村庄得 {1} 张牌，城市得 {2} 张。","पासा तय करता है कि कौन सी टाइलें देंगी: उस संख्या के पास का कस्बा {1} कार्ड पाता है, शहर {2}।","পাশা ঠিক করে কোন টাইল উৎপাদন করবে: ওই সংখ্যার পাশের শহর {1}টি কার্ড পায়, নগর {2}টি।","పాచిక ఏ టైల్స్ ఇస్తాయో నిర్ణయిస్తుంది: ఆ సంఖ్య పక్కన ఉన్న పట్టణం {1} కార్డు పొందుతుంది, నగరం {2}.","பகடை எந்த ஓடுகள் தரும் என்பதை முடிவு செய்யும்: அந்த எண்ணின் அருகிலுள்ள நகரம் {1} அட்டை பெறும், மாநகரம் {2}.","ದಾಳ ಯಾವ ಟೈಲ್‌ಗಳು ಕೊಡುತ್ತವೆ ಎಂದು ನಿರ್ಧರಿಸುತ್ತದೆ: ಆ ಸಂಖ್ಯೆಯ ಪಕ್ಕದ ಪಟ್ಟಣ {1} ಕಾರ್ಡ್, ನಗರ {2} ಪಡೆಯುತ್ತದೆ."],"Place the storm first, then you can swap with the bank or offer trades.":["Coloca primero la tormenta; luego podrás cambiar con el banco u ofrecer tratos.","Placez d'abord la tempête, puis vous pourrez échanger avec la banque ou proposer des échanges.","Coloque a tempestade primeiro; depois você poderá trocar com o banco ou oferecer trocas.","Letakkan badai dulu, lalu Anda bisa menukar dengan bank atau menawarkan dagang.","请先放置风暴，然后才能与银行兑换或提出交易。","पहले तूफ़ान रखें, फिर आप बैंक से बदल सकते हैं या सौदे का प्रस्ताव दे सकते हैं।","আগে ঝড় বসান, তারপর ব্যাংকের সঙ্গে বিনিময় বা প্রস্তাব দিতে পারবেন।","ముందు తుఫానును ఉంచండి, ఆపై బ్యాంక్‌తో మార్చుకోవచ్చు లేదా ఆఫర్లు ఇవ్వవచ్చు.","முதலில் புயலை வையுங்கள், பிறகு வங்கியுடன் மாற்றலாம் அல்லது சலுகைகள் அளிக்கலாம்.","ಮೊದಲು ಬಿರುಗಾಳಿ ಇಡಿ, ನಂತರ ಬ್ಯಾಂಕ್‌ನೊಂದಿಗೆ ವಿನಿಮಯ ಅಥವಾ ಪ್ರಸ್ತಾವ ನೀಡಬಹುದು."],"Roll the dice first, then you can swap with the bank or offer trades to other players.":["Primero tira los dados; luego podrás cambiar con el banco u ofrecer tratos a otros jugadores.","Lancez d'abord les dés, puis vous pourrez échanger avec la banque ou proposer des échanges aux autres joueurs.","Jogue os dados primeiro; depois você poderá trocar com o banco ou oferecer trocas a outros jogadores.","Lemp ంతులో మీరు ఒక్క ప్రత్యేక కార్డు మాత్రమే ఆడవచ్చు.","ஒரு முறையில் ஒரே ஒரு சிறப்பு அட்டையை மட்டுமே விளையாடலாம்.","ಒಂದು ಸರದಿಯಲ್ಲಿ ಒಂದೇ ವಿಶೇಷ ಕಾರ್ಡ್ ಆಡಬಹುದು."],"Finish your current Special card first.":["Termina primero tu carta especial actual.","Terminez d'abord votre carte spéciale en cours.","Termine primeiro sua carta especial atual.","Selesaikan kartu spesial Anda saat ini dulu.","请先完成当前的特殊卡。","पहले अपना मौजूदा विशेष कार्ड पूरा करें।","আগে আপনার বর্তমান বিশেষ কার্ড শেষ করুন।","ముందు మీ ప్రస్తుత ప్రత్యేక కార్డును పూర్తి చేయండి.","முதலில் உங்கள் தற்போதைய சிறப்பு அட்டையை முடியுங்கள்.","ಮೊದಲು ನಿಮ್ಮ ಪ್ರಸ್ತುತ ವಿಶೇಷ ಕಾರ್ಡ್ ಮುಗಿಸಿ."],"Finish your Special card before rolling.":["Termina tu carta especial antes de tirar.","Terminez votre carte spéciale avant de lancer.","Termine sua carta especial antes de jogar os dados.","Selesaikan kartu spesial Anda sebelum melempar.","掷骰子前请先完成特殊卡。","पासे फेंकने से पहले अपना विशेष कार्ड पूरा करें।","পাশা ফেলার আগে বিশেষ কার্ড শেষ করুন।","పాచికలు వేసే ముందు మీ ప్రత్యేక కార్డును పూర్తి చేయండి.","உருட்டும் முன் உங்கள் சிறப்பு அட்டையை முடியுங்கள்.","ದಾಳ ಎಸೆಯುವ ಮೊದಲು ನಿಮ್ಮ ವಿಶೇಷ ಕಾರ್ಡ್ ಮುಗಿಸಿ."],"The Special deck is empty.":["El mazo especial está vacío.","La pioche spéciale est vide.","O baralho especial está vazio.","Dek spesial kosong.","特殊牌堆已空。","विशेष डेक खाली है।","বিশেষ ডেক খালি।","ప్రత్యేక డెక్ ఖాళీగా ఉంది.","சிறப்பு தொகுப்பு காலியாக உள்ளது.","ವಿಶೇಷ ಡೆಕ್ ಖಾಲಿಯಾಗಿದೆ."],"You have no towns to upgrade. Build a town first.":["No tienes pueblos que mejorar. Construye uno primero.","Vous n'avez aucun village à améliorer. Construisez-en un d'abord.","Você não tem vilas para melhorar. Construa uma primeiro.","Anda tidak punya kota kecil untuk ditingkatkan. Bangun satu dulu.","你没有可升级的村庄。请先建造一个村庄。","आपके पास अपग्रेड करने के लिए कोई कस्बा नहीं है। पहले एक बनाएँ।","আপনার উন্নত করার মতো কোনো শহর নেই। আগে একটি বানান।","అప్‌గ్రేడ్ చేయడానికి మీకు పట్టణాలు లేవు. ముందు ఒకటి నిర్మించండి.","மேம்படுத்த உங்களிடம் நகரங்கள் இல்லை. முதலில் ஒன்றைக் கட்டுங்கள்.","ಅಪ್‌ಗ್ರೇಡ್ ಮಾಡಲು ನಿಮ್ಮಲ್ಲಿ ಪಟ್ಟಣಗಳಿಲ್ಲ. ಮೊದಲು ಒಂದನ್ನು ನಿರ್ಮಿಸಿ."],"There is no free spot where you can build a road.":["No hay ningún lugar libre donde puedas construir un camino.","Il n'y a aucun emplacement libre pour construire une route.","Não há nenhum local livre para construir uma estrada.","Tidak ada tempat kosong untuk membangun jalan.","没有可建造道路的空位。","सड़क बनाने के लिए कोई खाली जगह नहीं है।","রাস্তা বানানোর মতো কোনো ফাঁকা জায়গা নেই।","రోడ్డు నిర్మించడానికి ఖాళీ స్థలం లేదు.","சாலை கட்ட இலவச இடம் இல்லை.","ರಸ್ತೆ ನಿರ್ಮಿಸಲು ಖಾಲಿ ಸ್ಥಳವಿಲ್ಲ."],"No legal spot for a town yet. A town must touch one of your roads and be at least {n} steps from every other town or city. Build a road further out first.":["Aún no hay un lugar válido para un pueblo. Un pueblo debe tocar uno de tus caminos y estar al menos a {1} pasos de cualquier otro pueblo o ciudad. Construye primero un camino más lejos.","Pas encore d'emplacement valide pour un village. Un village doit toucher l'une de vos routes et être à au moins {1} pas de tout autre village ou ville. Construisez d'abord une route plus loin.","Ainda não há local válido para uma vila. Uma vila deve tocar uma das suas estradas e ficar a pelo menos {1} passos de qualquer outra vila ou cidade. Construa antes uma estrada mais adiante.","Belum ada lokasi sah untuk kota kecil. Kota kecil harus menyentuh salah satu jalan Anda dan berjarak minimal {1} langkah dari kota kecil atau kota lain. Bangun jalan lebih jauh dulu.","暂时没有合法的村庄位置。村庄必须紧邻你的一条道路，且与其他村庄或城市至少相隔 {1} 步。请先把道路修得更远。","अभी कस्बे के लिए कोई वैध जगह नहीं है। कस्बा आपकी किसी सड़क से जुड़ा हो और हर दूसरे कस्बे या शहर से कम से कम {1} कदम दूर हो। पहले सड़क को और आगे बनाएँ।","শহরের জন্য এখনও বৈধ জায়গা নেই। শহর আপনার কোনো রাস্তা ছুঁয়ে থাকতে হবে এবং অন্য প্রতিটি শহর বা নগর থেকে কমপক্ষে {1} ধাপ দূরে হতে হবে। আগে আরও দূরে একটি রাস্তা বানান।","పట్టణానికి ఇంకా చెల్లుబాటయ్యే స్థలం లేదు. పట్టణం మీ రోడ్లలో ఒకదాన్ని తాకాలి, ఇతర ప్రతి పట్టణం లేదా నగరానికి కనీసం {1} అడుగుల దూరంలో ఉండాలి. ముందు రోడ్డును మరింత దూరం నిర్మించండి.","நகரத்துக்கு இன்னும் செல்லுபடியாகும் இடம் இல்லை. நகரம் உங்கள் சாலைகளில் ஒன்றைத் தொட வேண்டும், மற்ற ஒவ்வொரு நகரம் அல்லது மாநகரத்திலிருந்தும் குறைந்தது {1} படிகள் தொலைவில் இருக்க வேண்டும். முதலில் சாலையை இன்னும் தொலைவில் கட்டுங்கள்.","ಪಟ್ಟಣಕ್ಕೆ ಇನ್ನೂ ಮಾನ್ಯ ಸ್ಥಳವಿಲ್ಲ. ಪಟ್ಟಣ ನಿಮ್ಮ ರಸ್ತೆಗಳಲ್ಲಿ ಒಂದನ್ನು ಮುಟ್ಟಬೇಕು ಮತ್ತು ಬೇರೆ ಪ್ರತಿ ಪಟ್ಟಣ ಅಥವಾ ನಗರದಿಂದ ಕನಿಷ್ಠ {1} ಹೆಜ್ಜೆ ದೂರವಿರಬೇಕು. ಮೊದಲು ರಸ್ತೆಯನ್ನು ಇನ್ನೂ ದೂರ ನಿರ್ಮಿಸಿ."],"Wait until the discards are finished.":["Espera a que terminen los descartes.","Attendez la fin des défausses.","Aguarde até os descartes terminarem.","Tunggu sampai pembuangan kartu selesai.","请等待弃牌完成。","छोड़े जाने वाले कार्ड पूरे होने तक प्रतीक्षा करें।","ফেলা কার্ডের কাজ শেষ হওয়া পর্যন্ত অপেক্ষা করুন।","పడేసే ప్రక్రియ పూర్తయ్యే వరకు వేచి ఉండండి.","விடும் அட்டைகள் முடியும் வரை காத்திருங்கள்.","ಬಿಡುವ ಕಾರ್ಡ್‌ಗಳು ಮುಗಿಯುವವರೆಗೆ ಕಾಯಿರಿ."],"Pick one of your own roads.":["Elige uno de tus propios caminos.","Choisissez l'une de vos routes.","Escolha uma das suas estradas.","Pilih salah satu jalan Anda sendiri.","请选择你自己的一条道路。","अपनी ही किसी सड़क को चुनें।","আপনার নিজের একটি রাস্তা বেছে নিন।","మీ స్వంత రోడ్లలో ఒకదాన్ని ఎంచుకోండి.","உங்கள் சொந்த சாலைகளில் ஒன்றைத் தேர்ந்தெடுங்கள்.","ನಿಮ್ಮ ಸ್ವಂತ ರಸ್ತೆಗಳಲ್ಲಿ ಒಂದನ್ನು ಆರಿಸಿ."],"Waiting for":["Esperando a","En attente de","Aguardando","Menunggu","正在等待","प्रतीक्षा है","অপেক্ষা করা হচ্ছে","వేచి ఉన్నారు","காத்திருக்கிறது","ಕಾಯುತ್ತಿದೆ"],"Not your turn. Waiting for":["No es tu turno. Esperando a","Pas votre tour. En attente de","Não é a sua vez. Aguardando","Bukan giliran Anda. Menunggu","还没轮到你。正在等待","अभी आपकी बारी नहीं है। प्रतीक्षा है","এখন আপনার পালা নয়। অপেক্ষা করা হচ্ছে","ఇది మీ వంతు కాదు. వేచి ఉన్నారు","உங்கள் முறை அல்ல. காத்திருக்கிறது","ಇದು ನಿಮ್ಮ ಸರದಿಯಲ್ಲ. ಕಾಯುತ್ತಿದೆ"],"That card is new: you can play it from your next turn.":["Esa carta es nueva: podrás jugarla desde tu próximo turno.","Cette carte est nouvelle : vous pourrez la jouer dès votre prochain tour.","Essa carta é nova: você poderá jogá-la a partir do próximo turno.","Kartu itu baru: Anda bisa memainkannya mulai giliran berikutnya.","这张卡是新的：下回合起才能使用。","वह कार्ड नया है: आप उसे अगली बारी से खेल सकते हैं।","ওই কার্ডটি নতুন: পরের পালা থেকে খেলতে পারবেন।","ఆ కార్డు కొత్తది: మీ తదుపరి వంతు నుండి ఆడవచ్చు.","அந்த அட்டை புதியது: அடுத்த முறையிலிருந்து விளையாடலாம்.","ಆ ಕಾರ್ಡ್ ಹೊಸದು: ನಿಮ್ಮ ಮುಂದಿನ ಸರದಿಯಿಂದ ಆಡಬಹುದು."],"You already have what you need for your next build.":["Ya tienes lo necesario para tu próxima construcción.","Vous avez déjà ce qu'il faut pour votre prochaine construction.","Você já tem o necessário para a próxima construção.","Anda sudah punya yang dibutuhkan untuk bangunan berikutnya.","你已经拥有下一次建造所需的资源。","अगले निर्माण के लिए आपके पास पहले से सब कुछ है।","আপনার পরের নির্মাণের জন্য যা দরকার তা ইতিমধ্যে আছে।","మీ తదుపరి నిర్మాణానికి కావలసినది ఇప్పటికే ఉంది.","உங்கள் அடுத்த கட்டுமானத்திற்குத் தேவையானது ஏற்கனவே உள்ளது.","ನಿಮ್ಮ ಮುಂದಿನ ನಿರ್ಮಾಣಕ್ಕೆ ಬೇಕಾದದ್ದು ಈಗಾಗಲೇ ಇದೆ."],"You have no spare cards to offer yet.":["Aún no tienes cartas de sobra para ofrecer.","Vous n'avez pas encore de cartes en trop à proposer.","Você ainda não tem cartas sobrando para oferecer.","Anda belum punya kartu cadangan untuk ditawarkan.","你还没有多余的牌可以提供。","आपके पास अभी देने के लिए अतिरिक्त कार्ड नहीं हैं।","দেওয়ার মতো বাড়তি কার্ড আপনার এখনও নেই।","ఇవ్వడానికి మీ దగ్గర ఇంకా అదనపు కార్డులు లేవు.","வழங்க உங்களிடம் இன்னும் உபரி அட்டைகள் இல்லை.","ನೀಡಲು ನಿಮ್ಮಲ್ಲಿ ಇನ್ನೂ ಹೆಚ್ಚುವರಿ ಕಾರ್ಡ್‌ಗಳಿಲ್ಲ."],"The bank has no {r} left.":["El banco no tiene más {1}.","La banque n'a plus de {1}.","O banco não tem mais {1}.","Bank kehabisan {1}.","银行已没有{1}了。","बैंक में अब {1} नहीं बचा।","ব্যাংকে আর {1} নেই।","బ్యాంక్‌లో {1} మిగల్లేదు.","வங்கியில் {1} மீதம் இல்லை.","ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ {1} ಉಳಿದಿಲ್ಲ."],"Nobody has a building on that tile, so nothing was stolen.":["Nadie tiene un edificio en esa casilla, así que no se robó nada.","Personne n'a de bâtiment sur cette tuile, donc rien n'a été volé.","Ninguém tem construção nessa peça, então nada foi roubado.","Tidak ada yang punya bangunan di petak itu, jadi tidak ada yang dicuri.","该地块上没有人有建筑，所以没有偷到东西。","उस टाइल पर किसी की इमारत नहीं है, इसलिए कुछ नहीं चुराया गया।","ওই টাইলে কারও ভবন নেই, তাই কিছু চুরি হয়নি।","ఆ టైల్‌పై ఎవరికీ నిర్మాణం లేదు, కాబట్టి ఏమీ దొంగిలించలేదు.","அந்த ஓட்டில் யாருக்கும் கட்டிடம் இல்லை, எனவே எதுவும் திருடப்படவில்லை.","ಆ ಟೈಲ್‌ನಲ್ಲಿ ಯಾರಿಗೂ ಕಟ್ಟಡವಿಲ್ಲ, ಹಾಗಾಗಿ ಏನೂ ಕದಿಯಲಿಲ್ಲ."],"Nobody has a building on that tile, so no card was stolen.":["Nadie tiene un edificio en esa casilla, así que no se robó ninguna carta.","Personne n'a de bâtiment sur cette tuile, donc aucune carte n'a été volée.","Ninguém tem construção nessa peça, então nenhuma carta foi roubada.","Tidak ada yang punya bangunan di petak itu, jadi tidak ada kartu yang dicuri.","该地块上没有人有建筑，所以没有偷到牌。","उस टाइल पर किसी की इमारत नहीं है, इसलिए कोई कार्ड नहीं चुराया गया।","ওই টাইলে কারও ভবন নেই, তাই কোনো কার্ড চুরি হয়নি।","ఆ టైల్‌పై ఎవరికీ నిర్మాణం లేదు, కాబట్టి కార్డు దొంగిలించలేదు.","அந்த ஓட்டில் யாருக்கும் கட்டிடம் இல்லை, எனவே அட்டை திருடப்படவில்லை.","ಆ ಟೈಲ್‌ನಲ್ಲಿ ಯಾರಿಗೂ ಕಟ್ಟಡವಿಲ್ಲ, ಹಾಗಾಗಿ ಕಾರ್ಡ್ ಕದಿಯಲಿಲ್ಲ."],"Nobody there had any cards to steal.":["Nadie allí tenía cartas para robar.","Personne là-bas n'avait de carte à voler.","Ninguém ali tinha cartas para roubar.","Tidak ada yang punya kartu untuk dicuri di sana.","那里没有人有牌可偷。","वहाँ किसी के पास चुराने को कार्ड नहीं थे।","সেখানে চুরি করার মতো কার্ড কারও ছিল না।","అక్కడ ఎవరి దగ్గరా దొంగిలించడానికి కార్డులు లేవు.","அங்கு திருட யாரிடமும் அட்டைகள் இல்லை.","ಅಲ್ಲಿ ಕದಿಯಲು ಯಾರ ಬಳಿಯೂ ಕಾರ್ಡ್ ಇರಲಿಲ್ಲ."],"Nobody holds more than {n} cards, so nobody discards.":["Nadie tiene más de {1} cartas, así que nadie descarta.","Personne n'a plus de {1} cartes, donc personne ne défausse.","Ninguém tem mais de {1} cartas, então ninguém descarta.","Tidak ada yang memegang lebih dari {1} kartu, jadi tidak ada yang membuang.","没有人手牌超过 {1} 张，所以无人弃牌。","किसी के पास {1} से ज़्यादा कार्ड नहीं हैं, इसलिए कोई कार्ड नहीं छोड़ता।","কারও কাছে {1}টির বেশি কার্ড নেই, তাই ক es pour la démolir et récupérer la pièce (sans récupérer de cartes).","Toque em uma das suas estradas para demoli-la e recuperar a peça (sem recuperar cartas).","Ketuk salah satu jalan Anda untuk membongkarnya dan mendapatkan bidaknya kembali (kartu tidak kembali).","点按你的一条道路将其拆除并取回棋子（不退还牌）。","अपनी किसी सड़क को तोड़ने और टुकड़ा वापस पाने के लिए उस पर टैप करें (कार्ड वापस नहीं मिलेंगे)।","আপনার একটি রাস্তা ভাঙতে ও টুকরোটি ফেরত পেতে সেটিতে ট্যাপ করুন (কার্ড ফেরত পাবেন না)।","మీ రోడ్లలో ఒకదాన్ని కూల్చి ముక్కను తిరిగి పొందడానికి దాన్ని నొక్కండి (కార్డులు తిరిగి రావు).","உங்கள் சாலைகளில் ஒன்றை இடித்து துண்டைத் திரும்பப் பெற அதைத் தட்டவும் (அட்டைகள் திரும்பாது).","ನಿಮ್ಮ ರಸ್ತೆಗಳಲ್ಲಿ ಒಂದನ್ನು ಕೆಡವಿ ತುಣುಕನ್ನು ಹಿಂಪಡೆಯಲು ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ (ಕಾರ್ಡ್‌ಗಳು ಹಿಂತಿರುಗುವುದಿಲ್ಲ)."],"Demolish this road? No cards back.":["¿Demoler este camino? No se devuelven cartas.","Démolir cette route ? Aucune carte rendue.","Demolir esta estrada? Nenhuma carta de volta.","Bongkar jalan ini? Kartu tidak kembali.","拆除这条道路？不会退还牌。","यह सड़क तोड़ें? कार्ड वापस नहीं मिलेंगे।","এই রাস্তা ভাঙবেন? কার্ড ফেরত পাবেন না।","ఈ రోడ్డును కూల్చాలా? కార్డులు తిరిగి రావు.","இந்தச் சாலையை இடிக்கவா? அட்டைகள் திரும்பாது.","ಈ ರಸ್ತೆ ಕೆಡವಬೇಕೇ? ಕಾರ್ಡ್‌ಗಳು ಹಿಂತಿರುಗುವುದಿಲ್ಲ."],"Road demolished":["Camino demolido","Route démolie","Estrada demolida","Jalan dibongkar","道路已拆除","सड़क तोड़ दी गई","রাস্তা ভাঙা হয়েছে","రోడ్డు కూల్చబడింది","சாலை இடிக்கப்பட்டது","ರಸ್ತೆ ಕೆಡವಲಾಗಿದೆ"],"Removing this road would split your road network and strand other roads, so it can't be demolished.":["Quitar este camino dividiría tu red de caminos y aislaría otros, así que no se puede demoler.","Retirer cette route couperait votre réseau et isolerait d'autres routes, elle ne peut donc pas être démolie.","Remover esta estrada dividiria sua rede e isolaria outras estradas, então ela não pode ser demolida.","Membongkar jalan ini akan memecah jaringan jalan Anda dan memutus jalan lain, jadi tidak bisa dibongkar.","拆除这条道路会切断你的道路网并孤立其他道路，因此无法拆除。","इस सड़क को हटाने से आपका सड़क-जाल बँट जाएगा और अन्य सड़कें कट जाएँगी, इसलिए इसे तोड़ा नहीं जा सकता।","এই রাস্তা সরালে আপনার রাস্তার নেটওয়ার্ক ভেঙে যাবে ও অন্য রাস্তা বিচ্ছিন্ন হবে, তাই এটি ভাঙা যাবে না।","ఈ రోడ్డు తీసివేస్తే మీ రోడ్ల నెట్‌వర్క్ విడిపోయి ఇతర రోడ్లు ఒంటరవుతాయి, కాబట్టి దీన్ని కూల్చలేరు.","இந்தச் சாலையை அகற்றினால் உங்கள் சாலை வலையமைப்பு பிரிந்து மற்ற சாலைகள் தனிமைப்படும், எனவே இதை இடிக்க முடியாது.","ಈ ರಸ್ತೆ ತೆಗೆದರೆ ನಿಮ್ಮ ರಸ್ತೆ ಜಾಲ ಒಡೆದು ಇತರ ರಸ್ತೆಗಳು ಒಂಟಿಯಾಗುತ್ತವೆ, ಆದ್ದರಿಂದ ಕೆಡವಲು ಸಾಧ್ಯವಿಲ್ಲ."],"Trade offer":["Oferta de comercio","Offre d'échange","Oferta de troca","Tawaran dagang","交易报价","व्यापार प्रस्ताव","বাণিজ্য প্রস্তাব","వ్యాపార ఆఫర్","வர்த்தகச் சலுகை","ವ್ಯಾಪಾರ ಪ್ರಸ್ತಾವ"],"Offer to":["Ofrecer a","Proposer à","Oferecer a","Tawarkan ke","向…提出","को प्रस्ताव","প্রস্তাব দিন","ఆఫర్ ఇవ్వండి","சலுகை அளி","ಪ್ರಸ್ತಾವ ನೀಡಿ"],"Send offer":["Enviar oferta","Envoyer l'offre","Enviar oferta","Kirim tawaran","发送报价","प्रस्ताव भेजें","প্রস্তাব পাঠান","ఆఫర్ పంపండి","சலுகையை அனுப்பு","ಪ್ರಸ್ತಾವ ಕಳುಹಿಸಿ"],"Cancel offer":["Cancelar oferta","Annuler l'offre","Cancelar oferta","Batalkan tawaran","取消报价","प्रस्ताव रद्द करें","প্রস্তাব বাতিল","ఆఫర్ రద్దు","சலுகையை ரத்து செய்","ಪ್ರಸ್ತಾವ ರದ್ದುಮಾಡಿ"],"Trade with players":["Comerciar con jugadores","Échanger avec les joueurs","Trocar com jogadores","Dagang dengan pemain","与玩家交易","खिलाड़ियों से व्यापार","খেলোয়াড়দের সঙ্গে বাণিজ্য","ఆటగాళ్లతో వ్యాపారం","வீரர்களுடன் வர்த்தகம்","ಆಟಗಾರರೊಂದಿಗೆ ವ್ಯಾಪಾರ"],"Trade with the bank":["Comerciar con el banco","Échanger avec la banque","Trocar com o banco","Dagang dengan bank","与银行交易","बैंक से व्यापार","ব্যাংকের সঙ্গে বাণিজ্য","బ్యాంక్‌తో వ్యాపారం","வங்கியுடன் வர்த்தகம்","ಬ್ಯಾಂಕ್‌ನೊಂದಿಗೆ ವ್ಯಾಪಾರ"],"Trade accepted":["Comercio aceptado","Échange accepté","Troca aceita","Dagang diterima","交易已接受","व्यापार स्वीकार","বাণিজ্য গৃহীত","వ్యాపారం ఆమోదించబడింది","வர்த்தகம் ஏற்கப்பட்டது","ವ್ಯಾಪಾರ ಒಪ್ಪಲಾಗಿದೆ"],"Trade rejected":["Comercio rechazado","Échange refusé","Troca recusada","Dagang ditolak","交易被拒绝","व्यापार अस्व 回应报价。","किसी ने समय पर प्रस्ताव का जवाब नहीं दिया।","কেউ সময়মতো প্রস্তাবের উত্তর দেয়নি।","ఎవరూ సమయానికి ఆఫర్‌కు స్పందించలేదు.","யாரும் சரியான நேரத்தில் சலுகைக்குப் பதிலளிக்கவில்லை.","ಯಾರೂ ಸಮಯಕ್ಕೆ ಪ್ರಸ್ತಾವಕ್ಕೆ ಉತ್ತರಿಸಲಿಲ್ಲ."],"Nobody answered the trade offer, so it was declined.":["Nadie respondió a la oferta de comercio, así que fue rechazada.","Personne n'a répondu à l'offre d'échange, elle a donc été refusée.","Ninguém respondeu à oferta de troca, então ela foi recusada.","Tidak ada yang menjawab tawaran dagang, jadi ditolak.","没有人回应交易报价，因此已被拒绝。","किसी ने व्यापार प्रस्ताव का जवाब नहीं दिया, इसलिए वह अस्वीकार हो गया।","কেউ বাণিজ্য প্রস্তাবের উত্তর দেয়নি, তাই তা প্রত্যাখ্যাত হয়েছে।","ఎవరూ వ్యాపార ఆఫర్‌కు స్పందించలేదు, కాబట్టి అది తిరస్కరించబడింది.","யாரும் வர்த்தகச் சலுகைக்குப் பதிலளிக்கவில்லை, எனவே அது நிராகரிக்கப்பட்டது.","ಯಾರೂ ವ್ಯಾಪಾರ ಪ್ರಸ್ತಾವಕ್ಕೆ ಉತ್ತರಿಸಲಿಲ್ಲ, ಆದ್ದರಿಂದ ಅದನ್ನು ತಿರಸ್ಕರಿಸಲಾಯಿತು."],"Pick at least one resource on each side.":["Elige al menos un recurso en cada lado.","Choisissez au moins une ressource de chaque côté.","Escolha pelo menos um recurso de cada lado.","Pilih minimal satu sumber daya di setiap sisi.","双方各至少选择一种资源。","हर तरफ़ कम से कम एक संसाधन चुनें।","প্রতিটি পাশে অন্তত একটি সম্পদ বাছুন।","ప్రతి వైపు కనీసం ఒక వనరు ఎంచుకోండి.","ஒவ்வொரு பக்கமும் குறைந்தது ஒரு வளத்தைத் தேர்ந்தெடுங்கள்.","ಪ್ರತಿ ಬದಿಯಲ್ಲಿ ಕನಿಷ್ಠ ಒಂದು ಸಂಪನ್ಮೂಲ ಆರಿಸಿ."],"You do not have enough to give":["No tienes suficiente para dar","Vous n'en avez pas assez à donner","Você não tem o suficiente para dar","Anda tidak punya cukup untuk diberikan","你没有足够的可给出","देने के लिए आपके पास पर्याप्त नहीं है","দেওয়ার মতো যথেষ্ট আপনার নেই","ఇవ్వడానికి మీ దగ్గర సరిపడా లేదు","கொடுக்க உங்களிடம் போதுமானது இல்லை","ಕೊಡಲು ನಿಮ್ಮಲ್ಲಿ ಸಾಕಷ್ಟಿಲ್ಲ"],"You do not have enough to offer":["No tienes suficiente para ofrecer","Vous n'en avez pas assez à proposer","Você não tem o suficiente para oferecer","Anda tidak punya cukup untuk ditawarkan","你没有足够的可提供","प्रस्ताव देने के लिए आपके पास पर्याप्त नहीं है","প্রস্তাব দেওয়ার মতো যথেষ্ট আপনার নেই","ఆఫర్ చేయడానికి మీ దగ్గర సరిపడా లేదు","சலுகை அளிக்க உங்களிடம் போதுமானது இல்லை","ಪ್ರಸ್ತಾವ ನೀಡಲು ನಿಮ್ಮಲ್ಲಿ ಸಾಕಷ್ಟಿಲ್ಲ"],"That counter-offer cannot be made. Try different cards.":["Esa contraoferta no se puede hacer. Prueba con otras cartas.","Cette contre-offre est impossible. Essayez d'autres cartes.","Essa contraoferta não pode ser feita. Tente outras cartas.","Tawaran balik itu tidak bisa dibuat. Coba kartu lain.","无法提出该还价。请尝试其他牌。","वह जवाबी प्रस्ताव नहीं दिया जा सकता। दूसरे कार्ड आज़माएँ।","সেই পাল্টা প্রস্তাব দেওয়া যাবে না। অন্য কার্ড চেষ্টা করুন।","ఆ ప్రతి-ఆఫర్ ఇవ్వడం సాధ్యం కాదు. వేరే కార్డులు ప్రయత్నించండి.","அந்த எதிர்ச்சலுகையை அளிக்க முடியாது. வேறு அட்டைகளை முயலுங்கள்.","ಆ ಪ್ರತಿ-ಪ್ರಸ್ತಾವ ನೀಡಲು ಸಾಧ್ಯವಿಲ್ಲ. ಬೇರೆ ಕಾರ್ಡ್‌ಗಳನ್ನು ಪ್ರಯತ್ನಿಸಿ."],"You already sent this exact offer this turn and nobody took it. Change the cards or the players to send a new one.":["Ya enviaste esta misma oferta en este turno y nadie la aceptó. Cambia las cartas o los jugadores para enviar otra.","Vous avez déjà envoyé cette offre ce tour et personne ne l'a prise. Changez les cartes ou les joueurs pour en envoyer une autre.","Você já enviou exatamente esta oferta neste turno e ninguém aceitou. Mude as cartas ou os jogadores para enviar outra.","Anda sudah mengirim tawaran yang sama persis di giliran ini dan tak ada yang menerima. Ubah kartu atau pemain untuk mengirim yang baru.","本回合你已发送过完全相同的报价，但无人接受。请更换牌或玩家再发送。","आप इस बारी में यही प्रस्ताव पहले भेज चुके हैं और किसी ने नहीं लिया। नया भेजने के लिए कार्ड या खिलाड़ी बदलें।","এই পালায় আপনি হুবহু একই প্রস্তাব পাঠিয়েছেন এবং কেউ নেয়নি। নতুন পাঠাতে কার্ড বা খেলোয়াড় বদলান।","ఈ వంతులో మీరు ఇదే ఆఫర్ ఇప్పటికే పంపారు, ఎవరూ తీసుకోలేదు. కొత్తది పంపడానికి కార్డులు లేదా ఆటగాళ్లను మార్చండి.","இந்த முறையில் இதே சலுகையை ஏற்கனவே அனுப்பினீர்கள், யாரும் ஏற்கவில்லை. புதியதை அனுப்ப அட்டைகளையோ வீரர்களையோ மாற்றுங்கள்.","ಈ ಸರದಿಯಲ್ಲಿ ನೀವು ಇದೇ ಪ್ರಸ್ತಾವ ಈಗಾಗಲೇ ಕಳುಹಿಸಿದ್ದೀರಿ, ಯಾರೂ ತೆಗೆದುಕೊಳ್ಳಲಿಲ್ಲ. ಹೊಸದನ್ನು ಕಳುಹಿಸಲು ಕಾರ್ಡ್ ಅಥವಾ ಆಟಗಾರರನ್ನು ಬದಲಿಸಿ."],"You ask for more cards than you give. Expect a no or a counter-offer.":["Pides más cartas de las que das. Espera un no o una contraoferta.","Vous demandez plus de cartes que vous n'en donnez. Attendez-vous à un refus ou une contre-offre.","Você pede mais cartas do que dá. Espere um não ou uma contraoferta.","Anda meminta lebih banyak kartu daripada yang diberikan. Siap-siap ditolak atau ditawar balik.","你要的牌比给出的多。预计会被拒绝或还价。","आप देने से ज़्यादा कार्ड माँग रहे हैं। मना या जवाबी प्रस्ताव की उम्मीद रखें।","আপনি যা দিচ্ছেন তার চেয়ে বেশি কার্ড চাইছেন। প্রত্যাখ্যান বা পাল্টা প্রস্তাবের আশা করুন।","మీరు ఇచ్చేదాని కంటే ఎక్కువ కార్డులు అడుగుతున్నారు. తిరస్కరణ లేదా ప్రతి-ఆఫర్ ఆశించండి.","நீங்கள் கொடுப்பதை விட அதிக அட்டைகளைக் கேட்கிறீர்கள். மறுப்பு அல்லது எதிர்ச்சலுகை எதிர்பாருங்கள்.","ನೀವು ಕೊಡುವುದಕ್ಕಿಂತ ಹೆಚ್ಚು ಕಾರ್ಡ್ ಕೇಳುತ್ತಿದ್ದೀರಿ. ನಿರಾಕರಣೆ ಅಥವಾ ಪ್ರತಿ-ಪ್ರಸ್ತಾವ ನಿರೀಕ್ಷಿಸಿ."],"Your offer is open. Waiting for an answer…":["Tu oferta está abierta. Esperando respuesta…","Votre offre est ouverte. En attente d'une réponse…","Sua oferta está aberta. Aguardando resposta…","Tawaran Anda terbuka. Menunggu jawaban…","你的报价已发出，等待回应…","आपका प्रस्ताव खुला है। जवाब की प्रतीक्षा है…","আপনার প্রস্তাব খোলা আছে। উত্তরের অপেক্ষা…","మీ ఆఫర్ తెరిచి ఉంది. సమాధానం కోసం వేచి ఉంది…","உங்கள் சலுகை திறந்துள்ளது. பதிலுக்காகக் காத்திருக்கிறது…","ನಿಮ್ಮ ಪ್ರಸ್ತಾವ ತೆರೆದಿದೆ. ಉತ್ತರಕ್ಕಾಗಿ ಕಾಯುತ್ತಿದೆ…"],"Your trade offer is open. Waiting for an answer…":["Tu oferta de comercio está abierta. Esperando respuesta…","Votre offre d'échange est ouverte. En attente d'une réponse…","Sua oferta de troca está aberta. Aguardando resposta…","Tawaran dagang Anda terbuka. Menunggu jawaban…","你的交易报价已发出，等待回应…","आपका व्यापार प्रस्ताव खुला है। जवाब की प्रतीक्षा है…","আপনার বাণিজ্য প্রস্তাব খোলা আছে। উত্তরের অপেক্ষা…","మీ వ్యాపార ఆఫర్ తెరిచి ఉంది. సమాధానం కోసం వేచి ఉంది…","உங்கள் வர்த்தகச் சலுகை திறந்துள்ளது. பதிலுக்காகக் காத்திருக்கிறது…","ನಿಮ್ಮ ವ್ಯಾಪಾರ ಪ್ರಸ್ತಾವ ತೆರೆದಿದೆ. ಉತ್ತರಕ್ಕಾಗಿ ಕಾಯುತ್ತಿದೆ…"],"Wai
