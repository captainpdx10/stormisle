const tutTrim=p=>{while(tot(p)>7){const k=KEYS.reduce((a,b)=>p.res[b]>p.res[a]?b:a);p.res[k]--}};
const tutSafe=()=>[4,5,6,8,9,10][Math.random()*6|0];

/* the dice are scripted while the tutorial is running */
function tutRoll(me){
  if(me){const n=TUT.rp=(TUT.rp||0)+1;
    if(n===3){tutTrim(G.P[0]);G.P[1].res={T:2,C:1,S:2,G:2,M:1};TUT.steal='S'}   /* 1st storm: Coach Bot holds 8 cards and must discard half */
    if(n===5){tutTrim(G.P[0]);G.P[1].res={T:1,C:1,S:1,G:1,M:1};TUT.steal='C'}    /* 2nd storm: Coach Bot has a card to steal */
    if(n===6){tutTrim(G.P[0]);tutTrim(G.P[1])}                                   /* your 7 again on your very next turn = civil war */
    return TROLL_ME[n-1]||tutSafe()}
  const n=TUT.rb=(TUT.rb||0)+1;
  if(n===3)TUT.sp=[                                                              /* turn 3: roads only */
    ()=>{E[TE.BE3].o=1;say('Coach Bot built a road.')},
    ()=>{E[TE.BE4].o=1;say('Coach Bot built another road.');TUT.spd=1}];
  if(n===4)TUT.sp=[                                                              /* turn 4: two cities */
    ()=>{V[TV.BA].l=2;say('Coach Bot upgraded a town to a city.')},
    ()=>{V[TV.BB].l=2;say('Coach Bot upgraded its second town to a city.');TUT.spd=2}];
  return TROLL_BOT[n-1]||tutSafe()}

/* Coach Bot never plays on its own in the tutorial: it follows the script */
function tutBot(){
  const p=G.cur;if(p!==1)return false;
  if(G.ph==='setup'){
    if(G.mode==='settle'){const k=G.s===1?TV.BA:TV.BB;if(canS(k,p)){vc(k);return true}return false}
    if(G.mode==='road'){const e=G.last===TV.BA?TE.BE1:TE.BE2;if(canR(e,p)){ec(e);return true}return false}
    return false}
  if(G.ph==='roll'){roll();return true}
  if(G.ph==='storm'){hc(4);TUT.b7=1;return true}                       /* its 7: the storm lands on YOUR best tile */
  if(G.ph==='steal'){steal(G.sv[0]);return true}
  if(G.ph==='act'){
    if((TUT.rb===3||TUT.rb===4)&&TUT.sp&&TUT.sp.length){TUT.sp.shift()();awards();render();return true}
    endTurn();return true}
  return false}

function tutAL(a,x){
  if(!TUT.on||!G||BOTRUN)return true;
  const q=G.P[G.cur];if(q&&q.bot)return true;
  let st=TSTEPS[TUT.i];for(let z=0;z<4&&st&&!st.gate&&!st.al&&TUT.i<TSTEPS.length-1;z++){tutGo(TUT.i+1);st=TSTEPS[TUT.i]}let ok=!!(st&&st.al&&st.al.includes(a));
  if(ok&&a==='mode'&&st.modes&&!st.modes.includes(x))ok=false;
  if(ok&&a==='vc'&&st.wl&&st.wl.v&&!st.wl.v.includes(x))ok=false;
  if(ok&&a==='ec'&&st.wl&&st.wl.e&&!st.wl.e.includes(x))ok=false;
  if(ok&&a==='hc'&&st.wl&&st.wl.h&&!st.wl.h.includes(x))ok=false;
  if(ok&&a==='bank'&&st.bk&&(TB.g!==st.bk[0]||TB.r!==st.bk[1]))ok=false;
  if(ok&&a==='play'&&st.card&&x!==st.card)ok=false;
  if(!ok)tutNudge();
  return ok}

/* yellow rings on the board that show exactly where to tap */
function tutMarks(){
  if(!TUT.on||!G)return'';const st=TSTEPS[TUT.i];if(!st||!st.mk)return'';
  if(st.gate&&st.gate())return'';
  const m=typeof st.mk==='function'?st.mk():st.mk;if(!m)return'';

  (m.v||[]).forEach(k=>{const v=V[k];if(v)s+=`<circle class="tmk" cx="${v.x}" cy="${v.y}" r="15"/>`});
  (m.e||[]).forEach(k=>{const e=E[k];if(e)s+=`<path class="tmk" d="${ePath(e)}" stroke-linecap="round" style="stroke-width:11"/>`});
  (m.h||[]).forEach(i=>{const h=H[i];if(h)s+=`<polygon class="tmk tmkh" points="${pp(h)}"/>`});
  return s+'</g>'}

/* free practice cards (shown with the usual +N pop-ups) */
function tutGive(res){
  const P=G.P[0],gain={};
  KEYS.forEach(k=>{const n=res[k]||0;if(n>P.res[k])gain[k]=n-P.res[k];P.res[k]=n});
  G.gain={0:gain};G.fx=[];G.fxK='steal';G.fxId=(G.fxId||0)+1;
  try{SND.play('gain')}catch(e){}}

const helpUI=()=>!HELP?'':`<div class="ovl" onclick="if(event.target===this){HELP=false;render()}"><div class="ovc help"><h2>How to play</h2>
<p><b>🎯 Goal.</b> Be the first to reach the <b>target score</b>: 10 points for 2 to 4 players, 12 for 5, 15 for 6, 17 for 7 and 20 for 8 players.<br>Town = 1 · City = 2 · 🛣️ Longest road (5+ roads in a row, longest wins) = +2 · 👥 Biggest population (3+ Mayor cards played, most wins) = +2 · each hidden 🃏 Joker = +1.</p>

<p><b>🔁 Trading.</b> The bank swaps 4 for 1. A port next to one of your towns makes it 3 for 1, or 2 for 1 for the resource shown on the port. You can also offer trades to other players.</p>

<p>🏙️ <b>Mayor.</b> Move the storm to any tile and steal a random card from a player who builds there. Use it to shut down the tile your rival depends on. Play 3 Mayors and you can take the 👥 Biggest population bonus (+2).</p>
<p>🛣️ <b>Road building.</b> Build 2 roads for free. Perfect for racing to a good town spot or for taking the 🛣️ Longest road bonus (+2).</p>
